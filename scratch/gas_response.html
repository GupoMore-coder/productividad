idade do acesso clínico e prevenir transferências fraudulentas de credenciais, o sistema aplica os seguintes limites temporais:\x3cbr\x3e\\u2022 \x3cb\x3eMáximo 3 atualizações em um período móvel de 6 meses\x3c\\\/b\x3e (180 dias).\x3cbr\x3e\\u2022 \x3cb\x3eMáximo 6 atualizações em um período móvel de 12 meses\x3c\\\/b\x3e (365 dias).\x3cbr\x3e\x3ci\x3eNota: Casos excepcionais podem enviar solicitação formal pelo \x3ca href\x3d\\\\\\\x22#seccion-canal\\\\\\\x22 style\x3d\\\\\\\x22color: #92400e; font-weight: 700; text-decoration: underline;\\\\\\\x22\x3eCanal Intermediado com a Direção\x3c\\\/a\x3e.\x3c\\\/i\x3e\\\x22,\\n    \\\x22card_update_limit_hdr\\\x22: \\\x22\x3cspan\x3e⏱️\x3c\\\/span\x3e Política Institucional de Frequência Máxima de Modificações:\\\x22,\\n    \\\x22card_vision_desc\\\x22: \\\x22Ao enviar radiografia ou tomografia, o motor de visão computacional analisa o segmento ósseo, sugere a classificação AO\/OTA mais provável e recupera a técnica cirúrgica correspondente.\\\x22,\\n    \\\x22card_vision_title\\\x22: \\\x22📷 Orientação Radiográfica AO\/OTA\\\x22,\\n    \\\x22card_voice_desc\\\x22: \\\x22No centro cirúrgico ou ambulatório, cirurgiões podem enviar áudios ao chat. O assistente transcreve termos ortopédicos com inteligência artificial e executa buscas sem necessidade de digitação.\\\x22,\\n    \\\x22card_voice_title\\\x22: \\\x22🎙️ Consultas por Nota de Voz\\\x22,\\n    \\\x22ch10_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e10\x3c\\\/span\x3e Governança Dinâmica: Comunicados Oficiais e Autoaprendizagem\\\x22,\\n    \\\x22ch11_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e🩺\x3c\\\/span\x3e Simulador Clínico Interativo do WhatsApp em Tempo Real\\\x22,\\n    \\\x22ch1_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e1\x3c\\\/span\x3e Filosofia Acadêmica e Princípio do Anonimato Cardinal\\\x22,\\n    \\\x22ch2_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e2\x3c\\\/span\x3e Protocolo de Admissão e Ciclo de Vida do Usuário\\\x22,\\n    \\\x22ch3_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e3\x3c\\\/span\x3e Modalidades de Busca Cirúrgica no Catálogo Especializado\\\x22,\\n    \\\x22ch4_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e4\x3c\\\/span\x3e Motor de Evidências Médicas Globais (PubMed \x26 Semantic Scholar)\\\x22,\\n    \\\x22ch5_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e5\x3c\\\/span\x3e Leitura Crítica de Artigos Próprios (Motor NotebookLM com Gemini)\\\x22,\\n    \\\x22ch6_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e6\x3c\\\/span\x3e Vias de Contribuição e Enriquecimento do Acervo Especializado\\\x22,\\n    \\\x22ch7_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e7\x3c\\\/span\x3e Potencializações Multimodais do Assistente: Voz, Visão AO e Boletim\\\x22,\\n    \\\x22ch8_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e8\x3c\\\/span\x3e Código de Conducta e Regime Disciplinar Institucional\\\x22,\\n    \\\x22ch9_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e9\x3c\\\/span\x3e Canal Intermediado Confidencial com a Direção\\\x22,\\n    \\\x22chip_bulletin\\\x22: \\\x22☀️ Boletim Dominical Cirúrgico\\\x22,\\n    \\\x22chip_multilingual\\\x22: \\\x22🌍 Cobertura Global Multilíngue\\\x22,\\n    \\\x22chip_notebooklm\\\x22: \\\x22🔬 Motor NotebookLM com Gemini\\\x22,\\n    \\\x22chip_pubmed\\\x22: \\\x22🌐 Motor PubMed \x26 Semantic Scholar\\\x22,\\n    \\\x22chip_service\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22pulse-dot\\\\\\\x22\x3e\x3c\\\/span\x3e Serviço Clínico 24\/7 Disponível\\\x22,\\n    \\\x22chip_vision\\\x22: \\\x22📷 Visão Radiográfica AO\/OTA\\\x22,\\n    \\\x22chip_voice\\\x22: \\\x22🎙️ Consultas por Áudio \/ Voz\\\x22,\\n    \\\x22custody_identity\\\x22: \\\x22🏛️ Gestor de Conteúdo\\\x22,\\n    \\\x22custody_label\\\x22: \\\x22DIREÇÃO \x26 CUSTÓDIA\\\x22,\\n    \\\x22diag2_caption\\\x22: \\\x22Esquema 2.1 \\u2014 Fluxo Autônomo de Admissão e Habilitação de Acesso\\\x22,\\n    \\\x22diag3_caption\\\x22: \\\x22Esquema 3.1 \\u2014 Pipeline de Recuperação Inteligente e Despacho Clínico\\\x22,\\n    \\\x22diag4_caption\\\x22: \\\x22Esquema 4.1 \\u2014 Tradução Médica e Recuperação de Evidência Científica\\\x22,\\n    \\\x22diag6_caption\\\x22: \\\x22Esquema 6.1 \\u2014 Ciclo Autônomo de Enriquecimento e Ingestão Colaborativa\\\x22,\\n    \\\x22edition_tag\\\x22: \\\x22Edição Oficial 2026.5 \\u2022 Guia Operacional Institucional\\\x22,\\n    \\\x22footer_edition\\\x22: \\\x22\x3cspan\x3eDocumento Mestre Vivo \\u2022 Edição Oficial v2026.5\x3c\\\/span\x3e\x3cbr\x3e\x3cspan style\x3d\\\\\\\x22color: var(--color-surgical-teal); font-weight: 700;\\\\\\\x22\x3eVigência Ativa e Atualização Permanente\x3c\\\/span\x3e\\\x22,\\n    \\\x22footer_org\\\x22: \\\x22\x3cb\x3eBiblioteca Médica Especializada de Ortopedia e Traumatologia\x3c\\\/b\x3e\x3cbr\x3eDireção Institucional: \x3cb\x3eDireção do Projeto\x3c\\\/b\x3e \\u2022 Serviço Clínico Permanente 24\/7\\\x22,\\n    \\\x22lang_label\\\x22: \\\x22IDIOMA:\\\x22,\\n    \\\x22masthead_subtitle\\\x22: \\\x22Cirurgia Ortopédica e Traumatologia \\u2022 Guia Mestre de Uso, Procedimentos e Governança\\\x22,\\n    \\\x22masthead_title\\\x22: \\\x22Biblioteca Médica Especializada\\\x22,\\n    \\\x22search_placeholder\\\x22: \\\x22Pesquisar tópicos (ex. AO, abordagem, PubMed, análise)...\\\x22,\\n    \\\x22sim_header_hint\\\x22: \\\x22Clique em qualquer comando para visualizar a resposta do Assistente:\\\x22,\\n    \\\x22sim_header_tag\\\x22: \\\x22⚡ Console de Demonstração em Tempo Real\\\x22,\\n    \\\x22svg_step1_desc\\\x22: \\\x22Nome, E-mail, Hospital e Nível\\\x22,\\n    \\\x22svg_step1_tag\\\x22: \\\x22PASSO 01: SOLICITAÇÃO\\\x22,\\n    \\\x22svg_step1_title\\\x22: \\\x22Registro pelo WhatsApp\\\x22,\\n    \\\x22svg_step2_desc\\\x22: \\\x22Verificação de veracidade (~24 h)\\\x22,\\n    \\\x22svg_step2_tag\\\x22: \\\x22PASSO 02: VALIDAÇÃO\\\x22,\\n    \\\x22svg_step2_title\\\x22: \\\x22Avaliação Autônoma\\\x22,\\n    \\\x22svg_step3_desc\\\x22: \\\x22Boas-vindas, Manual e Consultas 24\/7\\\x22,\\n    \\\x22svg_step3_tag\\\x22: \\\x22PASSO 03: HABILITAÇÃO\\\x22,\\n    \\\x22svg_step3_title\\\x22: \\\x22Acesso Pleno Imediato\\\x22,\\n    \\\x22t_row1_mod\\\x22: \\\x22\x3cb\x3e🦴 Patologia ou Técnica\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row1_res\\\x22: \\\x22Tratados, monografias, técnicas de abordagem, implantes e biomecânica.\\\x22,\\n    \\\x22t_row2_mod\\\x22: \\\x22\x3cb\x3e🎯 Classificação AO\/OTA \x26 Epônimos\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row2_res\\\x22: \\\x22Técnicas de redução, princípios biológicos e seleção de implantes de osteossíntese.\\\x22,\\n    \\\x22t_row3_mod\\\x22: \\\x22\x3cb\x3e🔪 Abordagens Cirúrgicas\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row3_res\\\x22: \\\x22Planos internervosos, anatomia cirúrgica aplicada e passos de dissecção.\\\x22,\\n    \\\x22t_row4_mod\\\x22: \\\x22\x3cb\x3e🔩 Instrumental e Fabricantes\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row4_res\\\x22: \\\x22Guias oficiais de técnica cirúrgica do fabricante com instrumentais passo a passo.\\\x22,\\n    \\\x22t_row5_mod\\\x22: \\\x22\x3cb\x3e📄 Código DOI, PMID ou ISBN\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row5_res\\\x22: \\\x22Entrega direta do artigo científico ou abertura automática de ticket de aquisição.\\\x22,\\n    \\\x22t_row6_mod\\\x22: \\\x22\x3cb\x3e🔤 Tolerância a Erros (Fuzzy)\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row6_res\\\x22: \\\x22Recuperação precisa mesmo com digitação rápida, erros ortográficos ou ausência de acentos.\\\x22,\\n    \\\x22t_row7_mod\\\x22: \\\x22\x3cb\x3e🎙️ Consultas por Áudio \/ Voz\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row7_res\\\x22: \\\x22Transcrição precisa de termos ortopédicos e execução direta da pesquisa.\\\x22,\\n    \\\x22t_row8_mod\\\x22: \\\x22\x3cb\x3e📑 Menu de Especialidades\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row8_res\\\x22: \\\x22Exibição do catálogo organizado por subespecialidades ortopédicas.\\\x22,\\n    \\\x22t_row9_mod\\\x22: \\\x22\x3cb\x3e📖 Solicitação do Manual\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row9_res\\\x22: \\\x22Despacho imediato do link interativo web e PDF do manual oficial.\\\x22,\\n    \\\x22th_example\\\x22: \\\x22Mensagem de Exemplo no Chat\\\x22,\\n    \\\x22th_modality\\\x22: \\\x22Modalidade de Busca\\\x22,\\n    \\\x22th_result\\\x22: \\\x22Resultado Clínico Entregue\\\x22,\\n    \\\x22toast_copy\\\x22: \\\x22Comando copiado para a área de transferência!\\\x22\\n  \x7d,\\n  \\\x22FR\\\x22: \x7b\\n    \\\x22btn_buzon\\\x22: \\\x22📤 Boîte Numérique\\\x22,\\n    \\\x22btn_buzon_share\\\x22: \\\x22📤 Partagez des Documents dans la Boîte Numérique\\\x22,\\n    \\\x22btn_print\\\x22: \\\x22🖨️ Imprimer \/ Enregistrer PDF\\\x22,\\n    \\\x22btn_sim\\\x22: \\\x22🩺 Simulateur WhatsApp\\\x22,\\n    \\\x22card_anon_desc\\\x22: \\\x22Le projet protège avec un zèle inébranlable la confidentialité de la Direction et des utilisateurs autorisés. Toutes les demandes, intermédiations et réponses s\x27effectuent via l\x27assistant autonome avec un chiffrement de bout en bout, préservant à tout moment l\x27anonymat et la confidentialité bilatérale.\\\x22,\\n    \\\x22card_anon_title\\\x22: \\\x22🛡️ Règle Sacrée de l\x27Anonymat Cardinal\\\x22,\\n    \\\x22card_bulletin_desc\\\x22: \\\x22Chaque dimanche à 8h00 (ou sur demande officielle), les confrères reçoivent une synthèse éditoriale comprenant 3 perles chirurgicales et les lectures de la semaine pour les réunions de service.\\\x22,\\n    \\\x22card_bulletin_title\\\x22: \\\x22☀️ Bulletin Chirurgical Dominical\\\x22,\\n    \\\x22card_comms_desc\\\x22: \\\x22Lors de mises à jour, de nouveaux modules ou d\x27évolutions des directives, un \x3cb\x3ecommuniqué officiel général\x3c\\\/b\x3e est diffusé à l\x27ensemble des médecins autorisés via l\x27assistant, assurant une information synchrone.\\\x22,\\n    \\\x22card_comms_title\\\x22: \\\x22📢 Communiqués Institutionnels Officiels\\\x22,\\n    \\\x22card_conduct_desc\\\x22: \\\x22\x3cp style\x3d\\\\\\\x22margin-bottom:8px;\\\\\\\x22\x3eLa bibliothèque exige une rigueur éthique et scientifique absolue. La Direction gère la situation de chaque médecin selon une \x3cb\x3eéchelle disciplinaire graduée\x3c\\\/b\x3e configurable via WhatsApp ou sur le registre central :\x3c\\\/p\x3e\x3cul style\x3d\\\\\\\x22margin-bottom: 12px;\\\\\\\x22\x3e\x3cli\x3e\x3cb\x3e1. ACTIF (Accès Complet) :\x3c\\\/b\x3e Accès complet aux recherches, analyse critique NotebookLM, synthèses PubMed et commandes d\x27articles.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e2. SUSPENDU TEMPORAIREMENT (24h, 48h ou 72h) :\x3c\\\/b\x3e Période transitoire en cas de langage inapproprié ou manquement mineur. Réactivation automatique à l\x27échéance.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e3. BLOQUÉ INDÉFINIMENT :\x3c\\\/b\x3e Suspension préventive en cas de récidive, soumise à l\x27évaluation directe de la Direction.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e4. EXCLU DÉFINITIVEMENT :\x3c\\\/b\x3e Révocation définitive et irrévocable du numéro et du compte en cas de tentative d\x27intrusion ou faute grave.\x3c\\\/li\x3e\x3c\\\/ul\x3e\\\x22,\\n    \\\x22card_conduct_title\\\x22: \\\x22⛔ Régime Disciplinaire et Échelle des Statuts Institutionnels\\\x22,\\n    \\\x22card_crit_anti_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eCroissance Autonome du Fonds :\x3c\\\/b\x3e Si un article analysé ne figure pas dans le catalogue, il est \x3cb\x3eautomatiquement intégré à la bibliothèque\x3c\\\/b\x3e.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eProtection Anti-Doublon :\x3c\\\/b\x3e Si les documents existent déjà, toute duplication est évitée et le système se concentre sur l\x27analyse comparative.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eLivrables :\x3c\\\/b\x3e Résumé PICO, méthodologie, puissance statistique, risque de biais et \x3cb\x3eMatrice Comparative Croisée\x3c\\\/b\x3e.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_crit_anti_title\\\x22: \\\x22⚖️ Incorporation Automatique et Anti-Doublon\\\x22,\\n    \\\x22card_crit_flow_title\\\x22: \\\x22🔬 Parcours Guidé d\x27Analyse Documentaire\\\x22,\\n    \\\x22card_donor_privacy\\\x22: \\\x22🔒 \x3cb\x3eRegistre Interne Confidentiel :\x3c\\\/b\x3e Les informations des confrères donateurs sont enregistrées exclusivement dans un registre privé pour la Direction. L\x27identité des donateurs ne sera jamais divulguée.\\\x22,\\n    \\\x22card_evidence_results_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eRésumé WhatsApp (3\\u20134 paragraphes) :\x3c\\\/b\x3e Consensus actuel, conclusions clés des 3 études les plus récentes et recommandations opératoires.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eLiens HTTPS Directs :\x3c\\\/b\x3e Liens vers PubMed, DOI et Consensus pour lire l\x27article original intégral.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eFiche de Preuves PDF :\x3c\\\/b\x3e Document clinique téléchargeable avec tableau comparatif et échelle de preuve d\x27Oxford.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_evidence_results_title\\\x22: \\\x22📊 Restitution des Résultats Structurés\\\x22,\\n    \\\x22card_lang_badge\\\x22: \\\x22MULTILINGUISME ILLIMITÉ\\\x22,\\n    \\\x22card_lang_comms_desc\\\x22: \\\x22Quelle que soit la langue dans laquelle le \x3cb\x3eGestionnaire de Contenu\x3c\\\/b\x3e rédige les communiqués officiels ou bulletins, la plateforme assure une traduction autonome de haute fidélité afin que chaque confrère reçoive le message dans sa langue de prédilection.\\\x22,\\n    \\\x22card_lang_comms_hdr\\\x22: \\\x22📢 Communiqués du Gestionnaire de Contenu dans Votre Langue :\\\x22,\\n    \\\x22card_lang_desc\\\x22: \\\x22Dans une perspective de rayonnement international et d\x27accompagnement fraternel de la communauté médicale mondiale, \x3cb\x3echaque confrère a la pleine liberté de choisir la langue dans laquelle il souhaite interagir avec l\x27assistant, recevoir les réponses, les synthèses de preuves et les communiqués officiels\x3c\\\/b\x3e.\\\x22,\\n    \\\x22card_lang_preserve_desc\\\x22: \\\x22\x3cb\x3eLes articles scientifiques, guides de techniques chirurgicales AO, manuels et monographies au format PDF sont strictement conservés et téléchargés dans leur langue originale de publication\x3c\\\/b\x3e.\x3cbr\x3eAfin de garantir la plus rigoureuse exactitude anatomique, d\x27éviter toute ambiguïté posologique et de respecter les indications d\x27implants certifiées par les fabricants, \x3cb\x3eles documents originaux ne sont jamais modifiés ni traduits artificiellement\x3c\\\/b\x3e. Ils sont transmis intacts et authentiques tels que publiés dans la littérature biomédicale internationale.\\\x22,\\n    \\\x22card_lang_preserve_hdr\\\x22: \\\x22\x3cspan\x3e🛡️\x3c\\\/span\x3e Principe Fondamental de Préservation de l\x27Originalité Documentaire :\\\x22,\\n    \\\x22card_lang_switch_hdr\\\x22: \\\x22🔄 Mise à Jour Immédiate et Sans Aucune Limite de Fréquence :\\\x22,\\n    \\\x22card_large_files_desc\\\x22: \\\x22\x3cp\x3ePour les atlas chirurgicaux volumineux ou les traités numérisés lourds, l\x27écosystème propose 4 solutions adaptées :\x3c\\\/p\x3e\x3cul style\x3d\\\\\\\x22margin-top: 8px;\\\\\\\x22\x3e\x3cli\x3e\x3cb\x3e1. Pièce Jointe WhatsApp (Jusqu\x27à 100 Mo \\u2013 2 Go) :\x3c\\\/b\x3e Joignez le fichier dans le chat avec le mot \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27APORTE\x27)\\\\\\\x22\x3eAPORTE\x3c\\\/span\x3e. Traitement continu en flux.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e2. Téléversement Fractionné (Chunked Upload) :\x3c\\\/b\x3e Sur la Boîte Numérique Web, les gros fichiers sont découpés en blocs de 10 à 15 Mo avec jauge de progression.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e3. Session Reprenable (Resumable Upload) :\x3c\\\/b\x3e Lien éphémère tolérant aux coupures de réseau pour reprendre le transfert sans perte de données.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e4. Optimisation dans le Navigateur :\x3c\\\/b\x3e Réglage automatique à 150\\u2013200 DPI de lecture clinique directement sur votre appareil, réduisant le poids de 70% sans dégradation visuelle.\x3c\\\/li\x3e\x3c\\\/ul\x3e\\\x22,\\n    \\\x22card_large_files_title\\\x22: \\\x22📦 Traités Volumineux et Fichiers Lourds (\x3e 45 Mo jusqu\x27à 2 Go)\\\x22,\\n    \\\x22card_learning_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eExpansion Synonymique :\x3c\\\/b\x3e Association automatique des termes équivalents (ex. \x3ci\x3eprothèse \x26rarr; arthroplastie \/ remplacement ; LCA \x26rarr; ligament croisé antérieur\x3c\\\/i\x3e).\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eDétection des Besoins :\x3c\\\/b\x3e Les recherches infructueuses sont mémorisées afin d\x27orienter les futures acquisitions documentaires.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_learning_title\\\x22: \\\x22🧠 Système d\x27Auto-Apprentissage Continu\\\x22,\\n    \\\x22card_msg_dir_desc\\\x22: \\\x22Pour proposer l\x27acquisition d\x27un traité, poser une question ou joindre la Direction en préservant l\x27anonymat réciproque, écrivez dans le chat :\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27MESSAGE A LA DIRECTION: \x27)\\\\\\\x22\x3eMESSAGE A LA DIRECTION: \x5bvotre demande détaillée\x5d\x3c\\\/span\x3e\x3cbr\x3eLe système transmet discrètement le message à la console exécutive.\\\x22,\\n    \\\x22card_msg_dir_title\\\x22: \\\x22📩 Envoi de Message à la Direction\\\x22,\\n    \\\x22card_option_a_desc\\\x22: \\\x22Les confrères peuvent déposer de la littérature médicale de manière confidentielle via le portail institutionnel anonyme, sans exposer de comptes personnels.\\\x22,\\n    \\\x22card_option_a_title\\\x22: \\\x22📁 Option A : Boîte Numérique Sécurisée Web\\\x22,\\n    \\\x22card_option_b_desc\\\x22: \\\x22Les médecins autorisés peuvent joindre directement un fichier PDF sur le chat WhatsApp avec le mot-clé \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27APORTE\x27)\\\\\\\x22\x3eAPORTE\x3c\\\/span\x3e ou \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27DON\x27)\\\\\\\x22\x3eDON\x3c\\\/span\x3e.\x3cbr\x3eL\x27assistant valide l\x27intégrité du document, le classe par sous-spécialité et renvoie un accusé de réception avec identifiant.\\\x22,\\n    \\\x22card_option_b_title\\\x22: \\\x22📱 Option B : Transmission Directe par WhatsApp\\\x22,\\n    \\\x22card_pubmed_desc\\\x22: \\\x22Permet d\x27interroger en direct plus de 35 millions de publications biomédicales indexées. Pour formuler une question scientifique, écrivez dans le chat :\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27PREUVES: \x27)\\\\\\\x22\x3ePREUVES: \x5bvotre question clinique ou technique\x5d\x3c\\\/span\x3e\x3cbr\x3e\x3ci\x3eExemple : \\\\\\\x22EVIDENCE: Haubannage vs plaques verrouillées dans les fractures de rotule 34-C3\\\\\\\x22\x3c\\\/i\x3e\\\x22,\\n    \\\x22card_pubmed_title\\\x22: \\\x22🌐 Consultation Directe de PubMed\\\x22,\\n    \\\x22card_resp_dir_desc\\\x22: \\\x22Dès son examen, le médecin reçoit la communication officielle directement dans son chat WhatsApp avec l\x27en-tête officiel :\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22\x3eDIRECTION DU PROJET: \x5bréponse institutionnelle\x5d\x3c\\\/span\x3e\x3cbr\x3eGarantissant un canal d\x27échange transparent, ordonné et sécurisé.\\\x22,\\n    \\\x22card_resp_dir_title\\\x22: \\\x22📤 Réception de la Réponse Officielle\\\x22,\\n    \\\x22card_status_notify\\\x22: \\\x22🔔 \x3cb\x3eProtocole de Notification Automatique :\x3c\\\/b\x3e Chaque décision de modification de statut émise par la Direction génère immédiatement un message officiel précisant la nouvelle situation, les motifs et la durée.\\\x22,\\n    \\\x22card_step1_desc\\\x22: \\\x22Le médecin contacte le bot WhatsApp en indiquant : \x3cb\x3eNom Complet\x3c\\\/b\x3e, \x3cb\x3eAdresse e-mail (personnelle ou institutionnelle)\x3c\\\/b\x3e, \x3cb\x3eHôpital ou Université\x3c\\\/b\x3e et \x3cb\x3eNiveau Actuel\x3c\\\/b\x3e (Interne R1\\u2013R4, Spécialiste, Ancien). Le système enregistre la demande avec le statut \x3ccode\x3eEN_ATTENTE_VALIDATION\x3c\\\/code\x3e et sécurise les données par scellement cryptographique.\\\x22,\\n    \\\x22card_step1_title\\\x22: \\\x221. Demande et Enregistrement Initial\\\x22,\\n    \\\x22card_step2_desc\\\x22: \\\x22La candidature est évaluée selon des critères prédéfinis de manière autonome et conformément aux directives du projet, après vérification des informations sous environ \x3cb\x3e24 heures\x3c\\\/b\x3e.\\\x22,\\n    \\\x22card_step2_title\\\x22: \\\x222. Analyse et Vérification Autonome\\\x22,\\n    \\\x22card_step3_desc\\\x22: \\\x22L\x27utilisateur reçoit une confirmation de bienvenue, le lien vers le Manuel Officiel interactif et son quota activé pour effectuer des recherches et des téléchargements cliniques 24\/7.\\\x22,\\n    \\\x22card_step3_title\\\x22: \\\x223. Accès Complet Immédiat\\\x22,\\n    \\\x22card_support_desc\\\x22: \\\x22Initiative médicale indépendante pour renforcer la formation continue des résidents et chirurgiens orthopédistes. La littérature, les guides et monographies fournis ont un \x3cb\x3ecaractère strictement pédagogique\x3c\\\/b\x3e ; toute décision diagnostique et thérapeutique relève exclusivement du jugement clinique du médecin traitant.\\\x22,\\n    \\\x22card_support_title\\\x22: \\\x22🎯 Soutien Médical et Avis de Non-Responsabilité\\\x22,\\n    \\\x22card_update_badge\\\x22: \\\x22AUTOGESTION SÉCURISÉE\\\x22,\\n    \\\x22card_update_cmd_desc\\\x22: \\\x22Pour consulter le guide de mise à jour, envoyez simplement : \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27METTRE A JOUR DONNEES\x27)\\\\\\\x22\x3eMETTRE A JOUR DONNEES\x3c\\\/span\x3e\x3cbr\x3eOu transmettez directement vos nouvelles données en un seul message structuré :\x3cbr\x3e\x3ccode style\x3d\\\\\\\x22background: var(--slate-100); color: var(--color-primary); padding: 4px 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 8.2pt; display: inline-block; margin-top: 6px; border: 1px solid var(--slate-300);\\\\\\\x22\x3eACTUALISER: \x5bNom Complet\x5d, \x5bE-mail\x5d, \x5bHôpital\/Université\x5d, \x5bNiveau\x5d\x3c\\\/code\x3e\\\x22,\\n    \\\x22card_update_cmd_hdr\\\x22: \\\x22Mécanisme et Commande d\x27Activation par WhatsApp :\\\x22,\\n    \\\x22card_update_desc\\\x22: \\\x22Conformément aux principes d\x27autodétermination informationnelle et d\x27exactitude des dossiers médicaux, \x3cb\x3echaque utilisateur dispose du droit inaliénable de demander la mise à jour ou rectification de ses données personnelles à tout moment\x3c\\\/b\x3e (changement d\x27e-mail, d\x27hôpital, avancement d\x27internat R1 à R4 ou obtention du titre de spécialiste).\\\x22,\\n    \\\x22card_update_limit_desc\\\x22: \\\x22Afin de garantir la traçabilité des accès cliniques et d\x27empêcher les transferts frauduleux d\x27identifiants, le système applique les limites suivantes :\x3cbr\x3e\\u2022 \x3cb\x3eMaximum 3 mises à jour sur une période glissante de 6 mois\x3c\\\/b\x3e (180 jours).\x3cbr\x3e\\u2022 \x3cb\x3eMaximum 6 mises à jour sur une période glissante de 12 mois\x3c\\\/b\x3e (365 jours).\x3cbr\x3e\x3ci\x3eRemarque : En cas de force majeure, une demande formelle peut être adressée via le \x3ca href\x3d\\\\\\\x22#seccion-canal\\\\\\\x22 style\x3d\\\\\\\x22color: #92400e; font-weight: 700; text-decoration: underline;\\\\\\\x22\x3eCanal Intermédiaire avec la Direction\x3c\\\/a\x3e.\x3c\\\/i\x3e\\\x22,\\n    \\\x22card_update_limit_hdr\\\x22: \\\x22\x3cspan\x3e⏱️\x3c\\\/span\x3e Politique Institutionnelle de Fréquence Maximale des Modifications :\\\x22,\\n    \\\x22card_vision_desc\\\x22: \\\x22En joignant une radiographie ou un scanner, le système de vision artificielle examine le segment osseux, propose la classification AO\/OTA la plus probable et récupère la technique chirurgicale adaptée.\\\x22,\\n    \\\x22card_vision_title\\\x22: \\\x22📷 Orientation Radiographique AO\/OTA\\\x22,\\n    \\\x22card_voice_desc\\\x22: \\\x22Au bloc opératoire ou en consultation, les chirurgiens peuvent transmettre des notes vocales. L\x27assistant transcrit précisément la terminologie orthopédique par IA et lance la recherche sans frappe au clavier.\\\x22,\\n    \\\x22card_voice_title\\\x22: \\\x22🎙️ Consultations par Note Vocale\\\x22,\\n    \\\x22ch10_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e10\x3c\\\/span\x3e Gouvernance Dynamique : Communiqués Officiels et Auto-Apprentissage\\\x22,\\n    \\\x22ch11_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e🩺\x3c\\\/span\x3e Simulateur Clinique Interactif de WhatsApp en Temps Réel\\\x22,\\n    \\\x22ch1_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e1\x3c\\\/span\x3e Philosophie Académique et Principe d\x27Anonymat Cardinal\\\x22,\\n    \\\x22ch2_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e2\x3c\\\/span\x3e Protocole d\x27Admission et Cycle de Vie de l\x27Utilisateur\\\x22,\\n    \\\x22ch3_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e3\x3c\\\/span\x3e Modalités de Recherche Chirurgicale dans le Catalogue Spécialisé\\\x22,\\n    \\\x22ch4_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e4\x3c\\\/span\x3e Moteur de Preuves Médicales Mondiales (PubMed \x26 Semantic Scholar)\\\x22,\\n    \\\x22ch5_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e5\x3c\\\/span\x3e Lecture Critique d\x27Articles Personnels (Moteur NotebookLM avec Gemini)\\\x22,\\n    \\\x22ch6_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e6\x3c\\\/span\x3e Voies de Contribution et Enrichissement du Fonds Spécialisé\\\x22,\\n    \\\x22ch7_title\\\x22: \\\x22\x3cspan class\x3d\\\\\ style\x3d\\\\\\\x22color: var(--color-surgical-teal); font-weight: 700;\\\\\\\x22\x3eValidité Active et Mise à Jour Continue\x3c\\\/span\x3e\\\x22,\\n    \\\x22footer_org\\\x22: \\\x22\x3cb\x3eBibliothèque Médicale Spécialisée d\x27Orthopédie et Traumatologie\x3c\\\/b\x3e\x3cbr\x3eDirection Institutionnelle : \x3cb\x3eDirection du Projet\x3c\\\/b\x3e \\u2022 Service Clinique Permanent 24\/7\\\x22,\\n    \\\x22lang_label\\\x22: \\\x22LANGUE :\\\x22,\\n    \\\x22masthead_subtitle\\\x22: \\\x22Chirurgie Orthopédique et Traumatologie \\u2022 Guide Maître d\x27Utilisation, Procédures et Gouvernance\\\x22,\\n    \\\x22masthead_title\\\x22: \\\x22Bibliothèque Médicale Spécialisée\\\x22,\\n    \\\x22search_placeholder\\\x22: \\\x22Rechercher des sujets (ex. AO, voie d\x27abord, PubMed, analyse)...\\\x22,\\n    \\\x22sim_header_hint\\\x22: \\\x22Cliquez sur une commande pour observer la réponse de l\x27Assistant :\\\x22,\\n    \\\x22sim_header_tag\\\x22: \\\x22⚡ Console de Démonstration en Direct\\\x22,\\n    \\\x22svg_step1_desc\\\x22: \\\x22Nom, E-mail, Hôpital et Niveau\\\x22,\\n    \\\x22svg_step1_tag\\\x22: \\\x22ÉTAPE 01 : DEMANDE\\\x22,\\n    \\\x22svg_step1_title\\\x22: \\\x22Enregistrement via WhatsApp\\\x22,\\n    \\\x22svg_step2_desc\\\x22: \\\x22Vérification des faits (~24 h)\\\x22,\\n    \\\x22svg_step2_tag\\\x22: \\\x22ÉTAPE 02 : VALIDATION\\\x22,\\n    \\\x22svg_step2_title\\\x22: \\\x22Évaluation Autonome\\\x22,\\n    \\\x22svg_step3_desc\\\x22: \\\x22Bienvenue, Manuel et Recherches 24\/7\\\x22,\\n    \\\x22svg_step3_tag\\\x22: \\\x22ÉTAPE 03 : HABILITATION\\\x22,\\n    \\\x22svg_step3_title\\\x22: \\\x22Accès Complet Immédiat\\\x22,\\n    \\\x22t_row1_mod\\\x22: \\\x22\x3cb\x3e🦴 Pathologie ou Technique\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row1_res\\\x22: \\\x22Traités, monographies, voies d\x27abord chirurgicales, implants et biomécanique.\\\x22,\\n    \\\x22t_row2_mod\\\x22: \\\x22\x3cb\x3e🎯 Classification AO\/OTA \x26 Éponymes\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row2_res\\\x22: \\\x22Techniques de réduction, principes biologiques et sélection d\x27implants d\x27ostéosynthèse.\\\x22,\\n    \\\x22t_row3_mod\\\x22: \\\x22\x3cb\x3e🔪 Voies d\x27Abord Chirurgicales\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row3_res\\\x22: \\\x22Plans internervieux, anatomie chirurgicale appliquée et étapes de dissection.\\\x22,\\n    \\\x22t_row4_mod\\\x22: \\\x22\x3cb\x3e🔩 Matériel et Fabricants\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row4_res\\\x22: \\\x22Guides officiels de technique opératoire du fabricant avec instrumentation détaillée.\\\x22,\\n    \\\x22t_row5_mod\\\x22: \\\x22\x3cb\x3e📄 Code DOI, PMID ou ISBN\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row5_res\\\x22: \\\x22Remise directe de l\x27article scientifique ou ouverture d\x27un ticket d\x27acquisition.\\\x22,\\n    \\\x22t_row6_mod\\\x22: \\\x22\x3cb\x3e🔤 Tolérance aux Fautes (Fuzzy)\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row6_res\\\x22: \\\x22Récupération précise malgré la frappe rapide, les fautes de frappe ou l\x27absence d\x27accents.\\\x22,\\n    \\\x22t_row7_mod\\\x22: \\\x22\x3cb\x3e🎙️ Consultations par Audio \/ Voix\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row7_res\\\x22: \\\x22Transcription fidèle des termes orthopédiques et exécution immédiate de la requête.\\\x22,\\n    \\\x22t_row8_mod\\\x22: \\\x22\x3cb\x3e📑 Menu des Spécialités\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row8_res\\\x22: \\\x22Affichage du catalogue classé par sous-spécialités orthopédiques.\\\x22,\\n    \\\x22t_row9_mod\\\x22: \\\x22\x3cb\x3e📖 Demande du Manuel\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row9_res\\\x22: \\\x22Envoi immédiat du lien web interactif et du PDF du manuel officiel.\\\x22,\\n    \\\x22th_example\\\x22: \\\x22Exemple de Message dans le Chat\\\x22,\\n    \\\x22th_modality\\\x22: \\\x22Modalité de Recherche\\\x22,\\n    \\\x22th_result\\\x22: \\\x22Résultat Clinique Délivré\\\x22,\\n    \\\x22toast_copy\\\x22: \\\x22Commande copiée dans le presse-papiers !\\\x22\\n  \x7d,\\n  \\\x22IT\\\x22: \x7b\\n    \\\x22btn_buzon\\\x22: \\\x22📤 Casella Digitale\\\x22,\\n    \\\x22btn_buzon_share\\\x22: \\\x22📤 Condividi Documenti nella Casella Digitale\\\x22,\\n    \\\x22btn_print\\\x22: \\\x22🖨️ Stampa \/ Salva PDF\\\x22,\\n    \\\x22btn_sim\\\x22: \\\x22🩺 Simulatore WhatsApp\\\x22,\\n    \\\x22card_anon_desc\\\x22: \\\x22Il progetto tutela con incrollabile rigore la riservatezza della Direzione e degli utenti autorizzati. Tutte le richieste, intermediazioni e risposte operano tramite l\x27assistente autonomo con crittografia end-to-end, preservando in ogni momento l\x27anonimato e la riservatezza bilaterale.\\\x22,\\n    \\\x22card_anon_title\\\x22: \\\x22🛡️ Regola Sacra dell\x27Anonimato Cardinale\\\x22,\\n    \\\x22card_bulletin_desc\\\x22: \\\x22Ogni domenica alle 8:00 (o su richiesta ufficiale), i medici ricevono un estratto editoriale con 3 perle chirurgiche e gli articoli in evidenza della settimana per il dibattito nei briefing clinici.\\\x22,\\n    \\\x22card_bulletin_title\\\x22: \\\x22☀️ Bollettino Chirurgico Domenicale\\\x22,\\n    \\\x22card_comms_desc\\\x22: \\\x22In occasione di aggiornamenti del servizio, introduzione di nuove funzionalità o revisione dei regolamenti, viene diffuso un \x3cb\x3ecomunicato ufficiale centralizzato\x3c\\\/b\x3e a tutti i medici autorizzati tramite l\x27assistente.\\\x22,\\n    \\\x22card_comms_title\\\x22: \\\x22📢 Comunicati Istituzionali Ufficiali\\\x22,\\n    \\\x22card_conduct_desc\\\x22: \\\x22\x3cp style\x3d\\\\\\\x22margin-bottom:8px;\\\\\\\x22\x3eLa biblioteca opera con rigorosi standard etici e scientifici. La Direzione gestisce la posizione di ciascun medico attraverso una \x3cb\x3escala disciplinare progressiva\x3c\\\/b\x3e gestibile via WhatsApp o sul foglio centrale:\x3c\\\/p\x3e\x3cul style\x3d\\\\\\\x22margin-bottom: 12px;\\\\\\\x22\x3e\x3cli\x3e\x3cb\x3e1. ATTIVO (Pienamente Abilitato):\x3c\\\/b\x3e Accesso ordinario a ricerche, analisi critica NotebookLM, sintesi PubMed e richieste di letteratura.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e2. SOSPESO TEMPORANEAMENTE (24h, 48h o 72h):\x3c\\\/b\x3e Periodo di inibizione transitorio in caso di linguaggio non conforme o lievi infrazioni. Riattivazione automatica al termine.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e3. BLOCCATO A TEMPO INDETERMINATO:\x3c\\\/b\x3e Sospensione cautelativa in caso di condotte recidive, soggetta a riesame diretto della Direzione.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e4. ESPULSO DEFINITIVAMENTE:\x3c\\\/b\x3e Revoca definitiva e irrevocabile dell\x27utenza e del recapito telefonico per tentativi di manomissione o gravi violazioni.\x3c\\\/li\x3e\x3c\\\/ul\x3e\\\x22,\\n    \\\x22card_conduct_title\\\x22: \\\x22⛔ Regime Disciplinare e Scala degli Status Istituzionali\\\x22,\\n    \\\x22card_crit_anti_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eCrescita Autonoma del Fondo:\x3c\\\/b\x3e Se durante l\x27analisi un documento allegato non è presente nell\x27archivio, \x3cb\x3eviene aggiunto automaticamente al catalogo\x3c\\\/b\x3e.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eFiltro Anti-Duplicazione:\x3c\\\/b\x3e Se i documenti sono già presenti, si evita qualsiasi duplicazione focalizzandosi esclusivamente sul confronto analitico.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eElaborati Forniti:\x3c\\\/b\x3e Riepilogo PICO, metodologia, significatività statistica, valutazione dei bias e \x3cb\x3eMatrice Comparativa Incrociata\x3c\\\/b\x3e.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_crit_anti_title\\\x22: \\\x22⚖️ Inclusione Automatica e Anti-Duplicazione\\\x22,\\n    \\\x22card_crit_flow_title\\\x22: \\\x22🔬 Percorso Guidato di Analisi Documentale\\\x22,\\n    \\\x22card_donor_privacy\\\x22: \\\x22🔒 \x3cb\x3eRegistro Interno Riservato:\x3c\\\/b\x3e I riferimenti dei medici donatori sono registrati esclusivamente in un archivio privato della Direzione. Non sarà mai divulgata l\x27identità di chi ha fornito una determinata opera.\\\x22,\\n    \\\x22card_evidence_results_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eSintesi WhatsApp (3\\u20134 paragrafi):\x3c\\\/b\x3e Consenso attuale, conclusioni chiave dei 3 studi più recenti e raccomandazioni chirurgiche.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eCollegamenti HTTPS Diretti:\x3c\\\/b\x3e Accesso immediato a PubMed, DOI e Consensus per consultare il testo completo originale.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eScheda di Evidenza PDF:\x3c\\\/b\x3e Documento clinico formale scaricabile con tabella comparativa e scala Oxford delle evidenze.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_evidence_results_title\\\x22: \\\x22📊 Consegna dei Risultati Strutturati\\\x22,\\n    \\\x22card_lang_badge\\\x22: \\\x22MULTILINGUISMO ILLIMITATO\\\x22,\\n    \\\x22card_lang_comms_desc\\\x22: \\\x22A prescindere dalla lingua con cui il \x3cb\x3eGestore dei Contenuti\x3c\\\/b\x3e redige i comunicati ufficiali o bollettini, la piattaforma esegue una traduzione autonoma ad alta fedeltà affinché ogni collega riceva il messaggio nella propria lingua prescelta.\\\x22,\\n    \\\x22card_lang_comms_hdr\\\x22: \\\x22📢 Comunicati del Gestore dei Contenuti nella Vostra Lingua:\\\x22,\\n    \\\x22card_lang_desc\\\x22: \\\x22In vista dell\x27espansione internazionale e della vicinanza fraterna alla comunità medica globale, \x3cb\x3eogni utente ha la facoltà di selezionare la lingua con cui interagire con l\x27assistente, ricevere risposte, sintesi di evidenze e comunicati ufficiali\x3c\\\/b\x3e.\\\x22,\\n    \\\x22card_lang_preserve_desc\\\x22: \\\x22\x3cb\x3eGli articoli scientifici, le guide di tecnica chirurgica AO, i libri di testo e le monografie in formato PDF sono rigorosamente conservati e scaricati nella loro lingua originale di pubblicazione\x3c\\\/b\x3e.\x3cbr\x3ePer garantire l\x27assoluta fedeltà anatomica, evitare ambiguità posologiche e rispettare i marchi di impianti certificati, \x3cb\x3ei documenti originali non vengono mai modificati né tradotti sinteticamente\x3c\\\/b\x3e. Vengono forniti autentici e integri così come prodotti dalla letteratura biomedica internazionale.\\\x22,\\n    \\\x22card_lang_preserve_hdr\\\x22: \\\x22\x3cspan\x3e🛡️\x3c\\\/span\x3e Principio Fondamentale di Conservazione dell\x27Originalità Documentale:\\\x22,\\n    \\\x22card_lang_switch_hdr\\\x22: \\\x22🔄 Aggiornamento Immediato e Senza Limiti di Frequenza:\\\x22,\\n    \\\x22card_large_files_desc\\\x22: \\\x22\x3cp\x3ePer atlanti chirurgici completi o corposi trattati scansionati, l\x27ecosistema dispone di 4 strategie ottimizzate di ricezione:\x3c\\\/p\x3e\x3cul style\x3d\\\\\\\x22margin-top: 8px;\\\\\\\x22\x3e\x3cli\x3e\x3cb\x3e1. Allegato WhatsApp (Fino a 100 MB \\u2013 2 GB):\x3c\\\/b\x3e Inviare il file direttamente in chat con la parola chiave \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27APORTE\x27)\\\\\\\x22\x3eAPORTE\x3c\\\/span\x3e. Elaborazione continua in streaming.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e2. Caricamento Frazionato (Chunked Upload):\x3c\\\/b\x3e Nella Casella Digitale Web, i file pesanti vengono suddivisi automaticamente in blocchi da 10 MB a 15 MB con barra di avanzamento in tempo reale.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e3. Sessione Riprendibile (Resumable Upload):\x3c\\\/b\x3e Collegamento temporaneo resistente a interruzioni di linea che consente di riprendere il trasferimento senza perdere dati.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e4. Ottimizzazione nel Browser:\x3c\\\/b\x3e Regolazione dinamica a 150\\u2013200 DPI clinici di lettura sul proprio dispositivo prima dell\x27invio, riducendo le dimensioni fino al 70% a parità di nitidezza.\x3c\\\/li\x3e\x3c\\\/ul\x3e\\\x22,\\n    \\\x22card_large_files_title\\\x22: \\\x22📦 Trattati Voluminosi e File di Grandi Dimensioni (\x3e 45 MB fino a 2 GB)\\\x22,\\n    \\\x22card_learning_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eEspansione dei Sinonimi:\x3c\\\/b\x3e Mappatura automatica dei termini clinici equivalenti (es. \x3ci\x3eprotesi \x26rarr; artroplastica \/ sostituzione; LCA \x26rarr; legamento crociato anteriore\x3c\\\/i\x3e).\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eRilevamento delle Lacune:\x3c\\\/b\x3e Le interrogazioni senza esito vengono memorizzate per orientare i successivi acquisti bibliografici.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_learning_title\\\x22: \\\x22🧠 Sistema di Autoapprendimento Continuo\\\x22,\\n    \\\x22card_msg_dir_desc\\\x22: \\\x22Per suggerire l\x27acquisizione di testi, segnalare quesiti o comunicare formalmente con la Direzione tutelando il reciproco anonimato, digitare in chat:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27MESSAGGIO ALLA DIREZIONE: \x27)\\\\\\\x22\x3eMESSAGGIO ALLA DIREZIONE: \x5brichiesta dettagliata\x5d\x3c\\\/span\x3e\x3cbr\x3eIl sistema inoltra il messaggio alla console esecutiva in forma confidenziale.\\\x22,\\n    \\\x22card_msg_dir_title\\\x22: \\\x22📩 Invio di Messaggi alla Direzione\\\x22,\\n    \\\x22card_option_a_desc\\\x22: \\\x22I collaboratori possono depositare letteratura medica in modo riservato attraverso il portale istituzionale anonimo, senza esporre account personali.\\\x22,\\n    \\\x22card_option_a_title\\\x22: \\\x22📁 Opzione A: Casella Digitale Protetta Web\\\x22,\\n    \\\x22card_option_b_desc\\\x22: \\\x22I medici autorizzati possono inviare direttamente un file PDF nella chat di WhatsApp accompagnato dalla dicitura \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27APORTE\x27)\\\\\\\x22\x3eAPORTE\x3c\\\/span\x3e o \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27DONAZIONE\x27)\\\\\\\x22\x3eDONAZIONE\x3c\\\/span\x3e.\x3cbr\x3eL\x27assistente valida l\x27integrità del file, lo cataloga per sottospecialità e restituisce ricevuta formale con codice identificativo.\\\x22,\\n    \\\x22card_option_b_title\\\x22: \\\x22📱 Opzione B: Invio Diretto via WhatsApp\\\x22,\\n    \\\x22card_pubmed_desc\\\x22: \\\x22Consente di interrogare in tempo reale oltre 35 milioni di pubblicazioni biomediche indicizzate. Per formulare un quesito scientifico, scrivere in chat:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27EVIDENZE: \x27)\\\\\\\x22\x3eEVIDENZE: \x5bdomanda clinica o tecnica\x5d\x3c\\\/span\x3e\x3cbr\x3e\x3ci\x3eEsempio: \\\\\\\x22EVIDENCE: Cerchiaggio vs placche bloccate nelle fratture di rotula 34-C3\\\\\\\x22\x3c\\\/i\x3e\\\x22,\\n    \\\x22card_pubmed_title\\\x22: \\\x22🌐 Interrogazione Diretta di PubMed\\\x22,\\n    \\\x22card_resp_dir_desc\\\x22: \\\x22Una volta esaminata la richiesta, il medico riceverà la comunicazione direttamente nella propria chat WhatsApp con l\x27intestazione formale:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22\x3eDIREZIONE DEL PROGETTO: \x5brisposta istituzionale\x5d\x3c\\\/span\x3e\x3cbr\x3eGarantendo un canale chiaro, ordinato e protetto.\\\x22,\\n    \\\x22card_resp_dir_title\\\x22: \\\x22📤 Ricezione del Riscontro Ufficiale\\\x22,\\n    \\\x22card_status_notify\\\x22: \\\x22🔔 \x3cb\x3eProtocolo di Notifica Automatica:\x3c\\\/b\x3e Ogni aggiornamento di stato deciso dalla Direzione genera tempestivamente un messaggio ufficiale all\x27utente indicante la nuova condizione, i motivi e la durata.\\\x22,\\n    \\\x22card_step1_desc\\\x22: \\\x22Il medico contatta il bot WhatsApp indicando: \x3cb\x3eNome e Cognome\x3c\\\/b\x3e, \x3cb\x3eE-mail (personale o istituzionale)\x3c\\\/b\x3e, \x3cb\x3eOspedale o Università\x3c\\\/b\x3e e \x3cb\x3eLivello Attuale\x3c\\\/b\x3e (Specializzando R1\\u2013R4, Specialista, Ex-allievo). Il sistema registra la richiesta con stato \x3ccode\x3eIN_ATTESA_DI_APPROVAZIONE\x3c\\\/code\x3e con crittografia protetta.\\\x22,\\n    \\\x22card_step1_title\\\x22: \\\x221. Richiesta e Registrazione Iniziale\\\x22,\\n    \\\x22card_step2_desc\\\x22: \\\x22La richiesta viene valutata secondo criteri prestabiliti in modo autonomo e conforme alle linee guida del progetto, previa verifica dei dati in circa \x3cb\x3e24 ore\x3c\\\/b\x3e.\\\x22,\\n    \\\x22card_step2_title\\\x22: \\\x222. Analisi e Verifica Autonoma\\\x22,\\n    \\\x22card_step3_desc\\\x22: \\\x22L\x27utente riceve il messaggio di benvenuto, il collegamento al Manuale Ufficiale interattivo e l\x27abilitazione della quota per effettuare consultazioni e download clinici 24\/7.\\\x22,\\n    \\\x22card_step3_title\\\x22: \\\x223. Accesso Completo Immediato\\\x22,\\n    \\\x22card_support_desc\\\x22: \\\x22Iniziativa medica indipendente volta a potenziare la formazione continua di specializzandi e chirurghi ortopedici. La letteratura, le guide e le monografie fornite hanno \x3cb\x3ecarattere strettamente pedagogico\x3c\\\/b\x3e; qualsiasi decisione diagnostica e terapeutica compete esclusivamente al giudizio clinico del medico curante.\\\x22,\\n    \\\x22card_support_title\\\x22: \\\x22🎯 Supporto Medico ed Esclusione di Responsabilità\\\x22,\\n    \\\x22card_update_badge\\\x22: \\\x22AUTOGESTIONE SICURA\\\x22,\\n    \\\x22card_update_cmd_desc\\\x22: \\\x22Per consultare la guida di aggiornamento, inviare semplicemente: \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27AGGIORNARE DATI\x27)\\\\\\\x22\x3eAGGIORNARE DATI\x3c\\\/span\x3e\x3cbr\x3eOppure trasmettere i nuovi dati in un unico messaggio strutturato:\x3cbr\x3e\x3ccode style\x3d\\\\\\\x22background: var(--slate-100); color: var(--color-primary); padding: 4px 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 8.2pt; display: inline-block; margin-top: 6px; border: 1px solid var(--slate-300);\\\\\\\x22\x3eAGGIORNARE: \x5bNome e Cognome\x5d, \x5bE-mail\x5d, \x5bOspedale\/Università\x5d, \x5bLivello\x5d\x3c\\\/code\x3e\\\x22,\\n    \\\x22card_update_cmd_hdr\\\x22: \\\x22Meccanismo e Comando di Attivazione via WhatsApp:\\\x22,\\n    \\\x22card_update_desc\\\x22: \\\x22In armonia con i principi di autodeterminazione informativa e integrità dei dati, \x3cb\x3eogni utente ha il diritto inalienabile di richiedere l\x27aggiornamento o la rettifica dei propri dati personali in qualsiasi momento\x3c\\\/b\x3e (cambio di e-mail, ospedale, avanzamento da R1 a R4 o conseguimento del titolo di specialista).\\\x22,\\n    \\\x22card_update_limit_desc\\\x22: \\\x22Al fine esclusivo di garantire la tracciabilità degli accessi clinici e prevenire cessioni illecite di credenziali, il sistema applica i seguenti limiti temporali:\x3cbr\x3e\\u2022 \x3cb\x3eMassimo 3 aggiornamenti in un periodo mobile di 6 mesi\x3c\\\/b\x3e (180 giorni).\x3cbr\x3e\\u2022 \x3cb\x3eMassimo 6 aggiornamenti in un periodo mobile di 12 mesi\x3c\\\/b\x3e (365 giorni).\x3cbr\x3e\x3ci\x3eNota: Per casi eccezionali è possibile inoltrare richiesta formale tramite il \x3ca href\x3d\\\\\\\x22#seccion-canal\\\\\\\x22 style\x3d\\\\\\\x22color: #92400e; font-weight: 700; text-decoration: underline;\\\\\\\x22\x3eCanal Intermediato con la Direzione\x3c\\\/a\x3e.\x3c\\\/i\x3e\\\x22,\\n    \\\x22card_update_limit_hdr\\\x22: \\\x22\x3cspan\x3e⏱️\x3c\\\/span\x3e Politica Istituzionale di Frequenza Massima delle Modifiche:\\\x22,\\n    \\\x22card_vision_desc\\\x22: \\\x22Inviando una radiografia o TC, il sistema di visione artificiale analizza il distretto scheletrico, propone la classificazione AO\/OTA preliminare più verosimile e recupera la tecnica chirurgica pertinente.\\\x22,\\n    \\\x22card_vision_title\\\x22: \\\x22📷 Orientamento Radiografico AO\/OTA\\\x22,\\n    \\\x22card_voice_desc\\\x22: \\\x22In sala operatoria o in ambulatorio, i chirurghi possono inviare note vocali in chat. L\x27assistente trascrive con precisione la terminologia ortopedica mediante intelligenza artificiale ed esegue la ricerca a mani libere.\\\x22,\\n    \\\x22card_voice_title\\\x22: \\\x22🎙️ Consultazioni Audio \/ Voce\\\x22,\\n    \\\x22ch10_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e10\x3c\\\/span\x3e Governance Dinamica: Comunicati Ufficiali e Autoapprendimento\\\x22,\\n    \\\x22ch11_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e🩺\x3c\\\/span\x3e Simulatore Clinico Interattivo di WhatsApp in Tempo Reale\\\x22,\\n    \\\x22ch1_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e1\x3c\\\/span\x3e Filosofia Accademica e Principio di Anonimato Cardinale\\\x22,\\n    \\\x22ch2_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e2\x3c\\\/span\x3e Protocollo di Ammissione e Ciclo di Vita dell\x27Utente\\\x22,\\n    \\\x22ch3_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e3\x3c\\\/span\x3e Modalità di Ricerca Chirurgica nel Catalogo Specializzato\\\x22,\\n    \\\x22ch4_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e4\x3c\\\/span\x3e Motore di Evidenze Mediche Globali (PubMed \x26 Semantic Scholar)\\\x22,\\n    \\\x22ch5_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e5\x3c\\\/span\x3e Lettura Critica di Articoli Personali (Motore NotebookLM con Gemini)\\\x22,\\n    \\\x22ch6_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e6\x3c\\\/span\x3e Vie di Contributo e Arricchimento del Patrimonio Specializzato\\\x22,\\n    \\\x22ch7_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e7\x3c\\\/span\x3e Potenziamenti Multimodali dell\x27Assistente: Voce, Visione AO e Bollettino\\\x22,\\n    \\\x22ch8_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e8\x3c\\\/span\x3e Codice di Condotta e Regime Disciplinare Istituzionale\\\x22,\\n    \\\x22ch9_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e9\x3c\\\/span\x3e Canale Intermediato Riservato con la Direzione\\\x22,\\n    \\\x22chip_bulletin\\\x22: \\\x22☀️ Bollettino Chirurgico Domenicale\\\x22,\\n    \\\x22chip_multilingual\\\x22: \\\x22🌍 Copertura Globale Multilingue\\\x22,\\n    \\\x22chip_notebooklm\\\x22: \\\x22🔬 Motore NotebookLM con Gemini\\\x22,\\n    \\\x22chip_pubmed\\\x22: \\\x22🌐 Motore PubMed \x26 Semantic Scholar\\\x22,\
