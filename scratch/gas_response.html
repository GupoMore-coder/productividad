22 y\x3d\\\x2287\\\x22 data-i18n\x3d\\\x22svg_step3_desc\\\x22 fill\x3d\\\x22#cbd5e1\\\x22 font-family\x3d\\\x22\x27Plus Jakarta Sans\x27\\\x22 font-size\x3d\\\x229.5\\\x22\x3eBienvenida, Manual y Consultas 24\/7\x3c\\\/text\x3e\\n        \x3c\\\/svg\x3e\\n      \x3c\\\/div\x3e\\n\\n      \x3cdiv class\x3d\\\x22editorial-grid-3\\\x22\x3e\\n        \x3cdiv class\x3d\\\x22card-swiss\\\x22\x3e\\n          \x3cdiv class\x3d\\\x22card-heading\\\x22 data-i18n\x3d\\\x22card_step1_title\\\x22\x3e1. Solicitud y Registro Inicial\x3c\\\/div\x3e\\n          \x3cp data-i18n\x3d\\\x22card_step1_desc\\\x22\x3eEl médico escribe al WhatsApp del bot indicando: \x3cb\x3eNombre Completo\x3c\\\/b\x3e, \x3cb\x3eCorreo electrónico (personal o institucional)\x3c\\\/b\x3e, \x3cb\x3eHospital o Universidad de formación\x3c\\\/b\x3e y \x3cb\x3eNivel actual\x3c\\\/b\x3e (R1\\u2013R4, Especialista, Egresado). El sistema registra la solicitud con estado \x3ccode\x3ePENDIENTE_APROBACION\x3c\\\/code\x3e y resguarda la información con sellado criptográfico en reposo.\x3c\\\/p\x3e\\n        \x3c\\\/div\x3e\\n        \x3cdiv class\x3d\\\x22card-swiss\\\x22\x3e\\n          \x3cdiv class\x3d\\\x22card-heading\\\x22 data-i18n\x3d\\\x22card_step2_title\\\x22\x3e2. Análisis y Verificación Autónoma\x3c\\\/div\x3e\\n          \x3cp data-i18n\x3d\\\x22card_step2_desc\\\x22\x3eSu solicitud es evaluada según parámetros preestablecidos de forma autónoma y conforme a los lineamientos del proyecto, luego de verificar la veracidad de la información en un período aproximado de \x3cb\x3e24 horas\x3c\\\/b\x3e.\x3c\\\/p\x3e\\n        \x3c\\\/div\x3e\\n        \x3cdiv class\x3d\\\x22card-swiss\\\x22\x3e\\n          \x3cdiv class\x3d\\\x22card-heading\\\x22 data-i18n\x3d\\\x22card_step3_title\\\x22\x3e3. Acceso Pleno Inmediato\x3c\\\/div\x3e\\n          \x3cp data-i18n\x3d\\\x22card_step3_desc\\\x22\x3eEl usuario recibe su confirmación de bienvenida, el enlace al Manual Oficial interactivo y su cupo habilitado para realizar consultas y descargas clínicas 24\/7.\x3c\\\/p\x3e\\n        \x3c\\\/div\x3e\\n      \x3c\\\/div\x3e\\n\\n      \\n      \x3cdiv class\x3d\\\x22card-swiss\\\x22 style\x3d\\\x22margin-top: 16px; border-left: 4px solid var(--color-cyan); background: #f0f9ff;\\\x22\x3e\\n        \x3cdiv class\x3d\\\x22card-heading\\\x22 style\x3d\\\x22color: var(--color-primary); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;\\\x22\x3e\\n          \x3cspan style\x3d\\\x22display: flex; align-items: center; gap: 8px;\\\x22\x3e\\n            \x3cspan style\x3d\\\x22font-size: 13pt;\\\x22\x3e📝\x3c\\\/span\x3e \x3cb\x3eDerecho a la Actualización de Datos Personales en Cualquier Momento\x3c\\\/b\x3e\\n          \x3c\\\/span\x3e\\n          \x3cspan style\x3d\\\x22font-family: var(--font-mono); font-size: 7.5pt; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: var(--radius-sm); font-weight: 700;\\\x22 data-i18n\x3d\\\x22card_update_badge\\\x22\x3eAUTOGESTIÓN SEGURA\x3c\\\/span\x3e\\n        \x3c\\\/div\x3e\\n        \x3cp data-i18n\x3d\\\x22card_update_desc\\\x22 style\x3d\\\x22margin-top: 8px; color: var(--slate-700); font-size: 9pt; line-height: 1.55;\\\x22\x3e\\n          En consonancia con los principios de autodeterminación informativa y calidad del registro médico institucional, \x3cb\x3etodo usuario tiene el derecho inalienable de solicitar la actualización o rectificación de sus datos personales en cualquier momento\x3c\\\/b\x3e (actualización de correo personal o institucional, cambio de hospital, ascenso de residencia de R1 a R4 o titulación de especialista).\\n        \x3c\\\/p\x3e\\n\\n        \x3cdiv style\x3d\\\x22background: #ffffff; border: 1px solid var(--slate-200); border-radius: var(--radius-sm); padding: 12px 16px; margin: 12px 0;\\\x22\x3e\\n          \x3cdiv data-i18n\x3d\\\x22card_update_cmd_hdr\\\x22 style\x3d\\\x22font-family: var(--font-mono); font-size: 7.8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--color-surgical-dark); margin-bottom: 6px;\\\x22\x3e\\n            Mecanismo y Comando de Activación por WhatsApp:\\n          \x3c\\\/div\x3e\\n          \x3cp data-i18n\x3d\\\x22card_update_cmd_desc\\\x22 style\x3d\\\x22margin: 0; font-size: 8.8pt; color: var(--slate-800);\\\x22\x3e\\n            Para consultar la guía de actualización, envíe simplemente: \x3cspan class\x3d\\\x22cmd-pill\\\x22 onclick\x3d\\\x22copyEditorialCmd(\x27ACTUALIZAR DATOS\x27)\\\x22\x3eACTUALIZAR DATOS\x3c\\\/span\x3e\\n            \x3cbr\x3e\\n            O transmita sus nuevos datos directamente en un solo mensaje estructurado:\\n            \x3cbr\x3e\\n            \x3ccode style\x3d\\\x22background: var(--slate-100); color: var(--color-primary); padding: 4px 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 8.2pt; display: inline-block; margin-top: 6px; border: 1px solid var(--slate-300);\\\x22\x3eACTUALIZAR: \x5bNombre Completo\x5d, \x5bCorreo\x5d, \x5bHospital\/Universidad\x5d, \x5bNivel\x5d\x3c\\\/code\x3e\\n          \x3c\\\/p\x3e\\n        \x3c\\\/div\x3e\\n\\n        \x3cdiv style\x3d\\\x22background: var(--color-amber-bg); border: 1px solid var(--color-amber-border); border-radius: var(--radius-sm); padding: 12px 16px; margin-top: 10px;\\\x22\x3e\\n          \x3cdiv data-i18n\x3d\\\x22card_update_limit_hdr\\\x22 style\x3d\\\x22font-family: var(--font-mono); font-size: 7.8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #92400e; display: flex; align-items: center; gap: 6px; margin-bottom: 4px;\\\x22\x3e\\n            \x3cspan\x3e⏱️\x3c\\\/span\x3e Política Institucional de Frecuencia Máxima de Modificaciones:\\n          \x3c\\\/div\x3e\\n          \x3cp data-i18n\x3d\\\x22card_update_limit_desc\\\x22 style\x3d\\\x22margin: 0; font-size: 8.6pt; color: #78350f; line-height: 1.5;\\\x22\x3e\\n            Con el fin exclusivo de mantener la trazabilidad de los accesos clínicos, resguardar la identidad de los médicos participantes y prevenir la transferencia ilícita o fraudulenta de credenciales autorizadas, el sistema enforza automáticamente los siguientes límites temporales:\\n            \x3cbr\x3e\\n            \\u2022 \x3cb\x3eMáximo 3 actualizaciones en un periodo móvil de 6 meses\x3c\\\/b\x3e (180 días).\x3cbr\x3e\\n            \\u2022 \x3cb\x3eMáximo 6 actualizaciones en un periodo móvil de 12 meses\x3c\\\/b\x3e (365 días).\x3cbr\x3e\\n            \x3ci\x3eNota: Si por razones excepcionales de fuerza mayor requiere una rectificación adicional tras agotar dicho límite, puede remitir su solicitud formal a través del \x3ca href\x3d\\\x22#seccion-canal-direccion\\\x22 style\x3d\\\x22color: #92400e; font-weight: 700; text-decoration: underline;\\\x22\x3eCanal Intermediado con la Dirección\x3c\\\/a\x3e.\x3c\\\/i\x3e\\n          \x3c\\\/p\x3e\\n        \x3c\\\/div\x3e\\n      \x3c\\\/div\x3e\\n\\n      \\n      \x3cdiv class\x3d\\\x22card-swiss\\\x22 style\x3d\\\x22margin-top: 16px; border-left: 4px solid var(--color-surgical-teal); background: #f0fdfa;\\\x22\x3e\\n        \x3cdiv class\x3d\\\x22card-heading\\\x22 style\x3d\\\x22color: var(--color-primary); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;\\\x22\x3e\\n          \x3cspan style\x3d\\\x22display: flex; align-items: center; gap: 8px;\\\x22\x3e\\n            \x3cspan style\x3d\\\x22font-size: 13pt;\\\x22\x3e🌐\x3c\\\/span\x3e \x3cb\x3eLibertad de Elección del Idioma de Comunicación y Preservación de Documentos Originales\x3c\\\/b\x3e\\n          \x3c\\\/span\x3e\\n          \x3cspan style\x3d\\\x22font-family: var(--font-mono); font-size: 7.5pt; background: #ccfbf1; color: #0f766e; padding: 2px 8px; border-radius: var(--radius-sm); font-weight: 700;\\\x22 data-i18n\x3d\\\x22card_lang_badge\\\x22\x3eMULTILINGÜISMO ILIMITADO\x3c\\\/span\x3e\\n        \x3c\\\/div\x3e\\n        \x3cp data-i18n\x3d\\\x22card_lang_desc\\\x22 style\x3d\\\x22margin-top: 8px; color: var(--slate-700); font-size: 9pt; line-height: 1.55;\\\x22\x3e\\n          Con miras a la expansión internacional y al acompañamiento fraterno de la comunidad médica global, \x3cb\x3etodo usuario tiene la potestad de seleccionar el idioma en el cual desea interactuar con el asistente, recibir respuestas, síntesis de evidencia y comunicados oficiales\x3c\\\/b\x3e.\\n        \x3c\\\/p\x3e\\n\\n        \x3cdiv class\x3d\\\x22editorial-grid-2\\\x22 style\x3d\\\x22margin: 12px 0; gap: 12px;\\\x22\x3e\\n          \x3cdiv style\x3d\\\x22background: #ffffff; border: 1px solid var(--slate-200); border-radius: var(--radius-sm); padding: 12px 14px;\\\x22\x3e\\n            \x3cdiv data-i18n\x3d\\\x22card_lang_switch_hdr\\\x22 style\x3d\\\x22font-family: var(--font-mono); font-size: 7.8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--color-surgical-teal); margin-bottom: 6px;\\\x22\x3e\\n              🔄 Actualización Inmediata y Sin Límites de Frecuencia:\\n            \x3c\\\/div\x3e\\n            \x3cp style\x3d\\\x22margin: 0; font-size: 8.6pt; color: var(--slate-800); line-height: 1.5;\\\x22\x3e\\n              A diferencia de los datos de identidad que cuentan con control preventivo de frecuencia, la preferencia de idioma \x3cb\x3eno tiene ninguna restricción de cambio\x3c\\\/b\x3e. Puede alternarse en cualquier momento enviando:\\n              \x3cbr\x3e\\n              \\u2022 \x3cspan class\x3d\\\x22cmd-pill\\\x22 onclick\x3d\\\x22copyEditorialCmd(\x27IDIOMA: ES\x27)\\\x22\x3eIDIOMA: ES\x3c\\\/span\x3e (Español)\x3cbr\x3e\\n              \\u2022 \x3cspan class\x3d\\\x22cmd-pill\\\x22 onclick\x3d\\\x22copyEditorialCmd(\x27LANGUAGE: EN\x27)\\\x22\x3eLANGUAGE: EN\x3c\\\/span\x3e (English)\x3cbr\x3e\\n              \\u2022 \x3cspan class\x3d\\\x22cmd-pill\\\x22 onclick\x3d\\\x22copyEditorialCmd(\x27IDIOMA: PT\x27)\\\x22\x3eIDIOMA: PT\x3c\\\/span\x3e (Português)\x3cbr\x3e\\n              \\u2022 \x3cspan class\x3d\\\x22cmd-pill lex; align-items: center; gap: 6px; margin-bottom: 6px;\\\x22\x3e\\n            \x3cspan\x3e🛡️\x3c\\\/span\x3e Principio Fundamental de Preservación de la Originalidad Documental:\\n          \x3c\\\/div\x3e\\n          \x3cp data-i18n\x3d\\\x22card_lang_preserve_desc\\\x22 style\x3d\\\x22margin: 0; font-size: 8.7pt; color: var(--slate-800); line-height: 1.55;\\\x22\x3e\\n            \x3cb\x3eLos artículos científicos, guías de técnica quirúrgica AO, libros de texto y monografías en formato PDF se preservan y descargan estrictamente en su idioma original de publicación\x3c\\\/b\x3e.\\n            \x3cbr\x3e\\n            Para garantizar la más estricta fidelidad anatómica, evitar ambigüedades en dosificaciones farmacológicas y respetar las indicaciones y marcas de implantes certificadas por casas matrices, \x3cb\x3elos documentos originales jamás se alteran ni se traducen de forma sintética\x3c\\\/b\x3e. Se entregan íntegros y auténticos tal como fueron concebidos por la literatura biomédica internacional.\\n          \x3c\\\/p\x3e\\n        \x3c\\\/div\x3e\\n      \x3c\\\/div\x3e\\n    \x3c\\\/section\x3e\\n\\n    \\n    \x3csection class\x3d\\\x22manual-section\\\x22 id\x3d\\\x22seccion-busqueda\\\x22\x3e\\n      \x3ch2 class\x3d\\\x22chapter-heading\\\x22 data-i18n\x3d\\\x22ch3_title\\\x22\x3e\\n        \x3cspan class\x3d\\\x22chapter-badge\\\x22\x3e3\x3c\\\/span\x3e\\n        Modalidades de Búsqueda Quirúrgica en el Catálogo Especializado\\n      \x3c\\\/h2\x3e\\n\\n      \\n      \x3cdiv class\x3d\\\x22diagram-container\\\x22\x3e\\n        \x3cdiv class\x3d\\\x22diagram-caption\\\x22 data-i18n\x3d\\\x22diag3_caption\\\x22\x3eEsquema 3.1 \\u2014 Pipeline de Recuperación Inteligente y Despacho Clínico\x3c\\\/div\x3e\\n        \x3csvg class\x3d\\\x22svg-diagram\\\x22 viewBox\x3d\\\x220 0 900 115\\\x22 xmlns\x3d\\\x22http:\/\/www.w3.org\/2000\/svg\\\x22\x3e\\n          \x3crect x\x3d\\\x2215\\\x22 y\x3d\\\x2218\\\x22 width\x3d\\\x22165\\\x22 height\x3d\\\x2280\\\x2 a_desc\\\x22\x3eLos colaboradores pueden depositar literatura médica de manera confidencial y blindada a través del portal institucional anónimo embebido, sin exponer cuentas personales ni interfaces externas.\x3c\\\/p\x3e\\n          \x3ca href\x3d\\\x22https:\/\/script.google.com\/macros\/s\/AKfycbxvKxFuTtTpcXXo3XgdAo1WAiIl4WhYlgd2ldPA2ePfC7Mmlo7VDu03BOhL9ybWL_Nv\/exec?mode\x3dbuzon\\\x22 target\x3d\\\x22_blank\\\x22 class\x3d\\\x22btn-buzon-interactivo buzon-direct-link\\\x22 data-i18n\x3d\\\x22btn_buzon_share\\\x22\x3e\\n            📤 Comparte tu información en el Buzón Digital\\n          \x3c\\\/a\x3e\\n        \x3c\\\/div\x3e\\n\\n        \x3cdiv class\x3d\\\x22card-swiss\\\x22\x3e\\n          \x3cdiv class\x3d\\\x22card-heading\\\x22 data-i18n\x3d\\\x22card_option_b_title\\\x22\x3e📱 Opción B: Ingesta Directa por WhatsApp\x3c\\\/div\x3e\\n          \x3cp data-i18n\x3d\\\x22card_option_b_desc\\\x22\x3eLos médicos autorizados pueden enviar directamente un archivo PDF al chat de WhatsApp acompañando el documento con el texto \x3cspan class\x3d\\\x22cmd-pill\\\x22 onclick\x3d\\\x22copyEditorialCmd(\x27APORTE\x27)\\\x22\x3eAPORTE\x3c\\\/span\x3e o \x3cspan class\x3d\\\x22cmd-pill\\\x22 onclick\x3d\\\x22copyEditorialCmd(\x27DONAR\x27)\\\x22\x3eDONAR\x3c\\\/span\x3e.\x3cbr\x3e\\n          El asistente valida la integridad del archivo, lo cataloga por subespecialidad y le devuelve una confirmación formal con su identificador de indexación.\x3c\\\/p\x3e\\n        \x3c\\\/div\x3e\\n      \x3c\\\/div\x3e\\n\\n      \x3cdiv class\x3d\\\x22card-swiss accent-cyan\\\x22 style\x3d\\\x22margin-top: 14px;\\\x22\x3e\\n        \x3cdiv class\x3d\\\x22card-heading\\\x22 data-i18n\x3d\\\x22card_large_files_title\\\x22\x3e📦 Tratados Voluminosos y Archivos de Gran Tamaño (\x3e 45 MB hasta 2 GB)\x3c\\\/div\x3e\\n        \x3cdiv data-i18n\x3d\\\x22card_large_files_desc\\\x22\x3e\\n        \x3cp\x3ePara atlas quirúrgicos completos, monografías enciclopédicas o tratados escaneados de alto volumen, el ecosistema cuenta con 4 estrategias de recepción optimizadas:\x3c\\\/p\x3e\\n        \x3cul style\x3d\\\x22margin-top: 8px;\\\x22\x3e\\n          \x3cli\x3e\x3cb\x3e1. Documento Adjunto por WhatsApp (Hasta 100 MB \\u2013 2 GB):\x3c\\\/b\x3e Puede adjuntar el archivo directamente en nuestro chat de WhatsApp junto con la palabra clave \x3cspan class\x3d\\\x22cmd-pill\\\x22 onclick\x3d\\\x22copyEditorialCmd(\x27APORTE\x27)\\\x22\x3eAPORTE\x3c\\\/span\x3e. La plataforma procesa la recepción en streaming continuo.\x3c\\\/li\x3e\\n          \x3cli\x3e\x3cb\x3e2. Subida Fraccionada por Bloques (Chunked Upload):\x3c\\\/b\x3e En el Buzón Digital Web, los documentos pesados son divididos automáticamente en bloques de 10 MB a 15 MB transmitidos en secuencia con barra de progreso interactiva.\x3c\\\/li\x3e\\n          \x3cli\x3e\x3cb\x3e3. Sesión Reanudable Efímera (Resumable Upload):\x3c\\\/b\x3e Enlace temporal con tolerancia a interrupciones de red que permite reanudar transferencias sin perder bytes ya transmitidos.\x3c\\\/li\x3e\\n          \x3cli\x3e\x3cb\x3e4. Optimización y Recompresión en Navegador:\x3c\\\/b\x3e Ajuste dinámico de escaneos a 150\\u2013200 DPI clínicos de lectura en su propio dispositivo antes de enviar, reduciendo el peso hasta un 70% sin menoscabo visual.\x3c\\\/li\x3e\\n        \x3c\\\/ul\x3e\\n      \x3c\\\/div\x3e\\n        \x3cdiv data-i18n\x3d\\\x22card_donor_privacy\\\x22 style\x3d\\\x22margin-top: 10px; font-size: 8pt; color: var(--slate-600); border-top: 1px dashed var(--slate-300); padding-top: 8px;\\\x22\x3e\\n          🔒 \x3cb\x3eRegistro de Control Interno Confidencial:\x3c\\\/b\x3e Los datos de los médicos donantes se asientan exclusivamente en una sección de registro privado para la Dirección. Nunca se publicará, expondrá ni informará qué usuario aportó determinada información.\\n        \x3c\\\/div\x3e\\n      \x3c\\\/div\x3e\\n    \x3c\\\/section\x3e\\n\\n    \\n    \x3csection class\x3d\\\x22manual-section\\\x22 id\x3d\\\x22seccion-multimodal\\\x22\x3e\\n      \x3ch2 class\x3d\\\x22chapter-heading\\\x22 data-i18n\x3d\\\x22ch7_title\\\x22\x3e\\n        \x3cspan class\x3d\\\x22chapter-badge\\\x22\x3e7\x3c\\\/span\x3e\\n        Potenciaciones Multimodales del Asistente: Voz, Visión AO y Boletín\\n      \x3c\\\/h2\x3e\\n\\n      \x3cdiv class\x3d\\\x22editorial-grid-3\\\x22\x3e\\n        \x3cdiv class\x3d\\\x22card-swiss\\\x22\x3e\\n          \x3cdiv class\x3d\\\x22card-heading\\\x22 data-i18n\x3d\\\x22card_voice_title\\\x22\x3e🎙️ Consultas por Nota de Voz\x3c\\\/div\x3e\\n          \x3cp data-i18n\x3d\\\x22card_voice_desc\\\x22\x3eEn áreas de lavado, consulta o quirófano, los cirujanos pueden enviar notas de voz al chat. El asistente procesa el audio multimodal con inteligencia artificial para transcribir con precisión la terminología ortopédica y ejecutar la búsqueda o lectura crítica sin necesidad de teclear.\x3c\\\/p\x3e\\n        \x3c\\\/div\x3e\\n\\n        \x3cdiv class\x3d\\\x22card-swiss\\\x22\x3e\\n          \x3cdiv class\x3d\\\x22card-heading\\\x22 data-i18n\x3d\\\x22card_vision_title\\\x22\x3e📷 Orientación Radiográfica AO\/OTA\x3c\\\/div\x3e\\n          \x3cp data-i18n\x3d\\\x22card_vision_desc\\\x22\x3eAl adjuntar una radiografía o tomografía en el chat, el motor de visión computacional analiza el segmento óseo, sugiere la clasificación AO\/OTA preliminar más probable y recupera de forma proactiva la monografía y técnica quirúrgica correspondiente.\x3c\\\/p\x3e\\n        \x3c\\\/div\x3e\\n\\n        \x3cdiv class\x3d\\\x22card-swiss\\\x22\x3e\\n          \x3cdiv class\x3d\\\x22card-heading\\\x22 data-i18n\x3d\\\x22card_bulletin_title\\\x22\x3e☀️ Boletín Dominical de Actualización\x3c\\\/div\x3e\\n          \x3cp data-i18n\x3d\\\x22card_bulletin_desc\\\x22\x3eTodos los domingos a las 8:00 AM (o por solicitud oficial), los médicos autorizados reciben un resumen editorial con 3 perlas quirúrgicas y lecturas destacadas de la semana para debate académico en la revista de sala (Grand Rounds).\x3c\\\/p\x3e\\n        \x3c\\\/div\x3e\\n      \x3c\\\/div\x3e\\n    \x3c\\\/section\x3e\\n\\n    \\n    \x3csection class\x3d\\\x22manual-section\\\x22 id\x3d\\\x22seccion-conducta\\\x22\x3e\\n      \x3ch2 class\x3d\\\x22chapter-heading\\\x22 data-i18n\x3d\\\x22ch8_title\\\x22\x3e\\n        \x3cspan class\x3d\\\x22chapter-badge\\\x22\x3e8\x3c\\\/span\x3e\\n        Código de Conducta y Régimen Disciplinario Institucional\\n      \x3c\\\/h2\x3e\\n\\n      \x3cdiv class\x3d\\\x22card-swiss accent-rose\\\x22\x3e\\n        \x3cdiv class\x3d\\\x22card-heading\\\x22 data-i18n\x3d\\\x22card_conduct_title\\\x22 style\x3d\\\x22color: var(--color-rose);\\\x22\x3e⛔ Régimen Disciplinario y Escala de Estatus Institucionales\x3c\\\/div\x3e\\n        \x3cdiv data-i18n\x3d\\\x22card_conduct_desc\\\x22\x3e\\n        \x3cp style\x3d\\\x22margin-bottom:8px;\\\x22\x3eLa biblioteca es un instrumento de estricto rigor científico y ético. La Dirección gestiona la condición de cada participante mediante una \x3cb\x3eescala disciplinaria escalonada\x3c\\\/b\x3e modificable vía WhatsApp o directamente en la hoja de control:\x3c\\\/p\x3e\\n        \x3cul style\x3d\\\x22margin-bottom: 12px;\\\x22\x3e\\n          \x3cli\x3e\x3cb\x3e1. ACTIVO (Habilitado Pleno):\x3c\\\/b\x3e Acceso regular a búsquedas, lectura crítica NotebookLM, síntesis PubMed y solicitud de literatura.\x3c\\\/li\x3e\\n          \x3cli\x3e\x3cb\x3e2. SUSPENDIDO TEMPORALMENTE (24h, 48h o 72h):\x3c\\\/b\x3e Período de inhabilitación transitorio ante lenguaje inapropiado o faltas leves. El bot calcula el término y se reactiva automáticamente al vencer el plazo.\x3c\\\/li\x3e\\n          \x3cli\x3e\x3cb\x3e3. BLOQUEADO INDEFINIDAMENTE:\x3c\\\/b\x3e Inhabilitación preventiva ante conductas reiteradas o desacato a las directrices, sujeto a valoración directa de la Dirección.\x3c\\\/li\x3e\\n          \x3cli\x3e\x3cb\x3e4. EXPULSADO PERMANENTE:\x3c\\\/b\x3e Veto definitivo e irrevocable del número telefónico y registro ante intentos de vulneración o faltas graves. El sistema bloquea de raíz cualquier intento futuro de reincorporación.\x3c\\\/li\x3e\\n        \x3c\\\/ul\x3e\\n      \x3c\\\/div\x3e\\n        \x3cdiv data-i18n\x3d\\\x22card_status_notify\\\x22 style\x3d\\\x22font-size: 8.5pt; color: var(--slate-700); background: rgba(225, 29, 72, 0.05); border: 1px solid rgba(225, 29, 72, 0.2); border-radius: var(--radius-sm); padding: 10px 14px;\\\x22\x3e\\n          🔔 \x3cb\x3eProtocolo de Notificación Automática:\x3c\\\/b\x3e Cada vez que la Dirección modifica el estatus de un usuario (sea desde WhatsApp o en la hoja central), el sistema despacha de forma inmediata un mensaje oficial al usuario informándole de su nueva condición, causales y tiempo de vigencia.\\n        \x3c\\\/div\x3e\\n      \x3c\\\/div\x3e\\n    \x3c\\\/section\x3e\\n\\n    \\n    \x3csection class\x3d\\\x22manual-section\\\x22 id\x3d\\\x22seccion-canal\\\x22\x3e\\n      \x3ch2 class\x3d\\\x22chapter-heading\\\x22 data-i18n\x3d\\\x22ch9_title\\\x22\x3e\\n        \x3cspan class\x3d\\\x22chapter-badge\\\x22\x3e9\x3c\\\/span\x3e\\n        Canal Intermediado Confidencial con la Dirección\\n      \x3c\\\/h2\x3e\\n\\n      \x3cdiv class\x3d\\\x22editorial-grid-2\\\x22\x3e\\n        \x3cdiv class\x3d\\\x22card-swiss accent-teal\\\x22\x3e\\n          \x3cdiv class\x3d\\\x22card-heading\\\x22 data-i18n\x3d\\\x22card_msg_dir_title\\\x22\x3e📩 Envío de Mensaje a la Dirección\x3c\\\/div\x3e\\n          \x3cp data-i18n\x3d\\\x22card_msg_dir_desc\\\x22\x3ePara elevar sugerencias de literatura, reportar dudas o comunicarse formalmente con la Dirección sin vulnerar el anonimato bilateral, escriba en el chat:\x3cbr\x3e\\n          \x3cspan class\x3d\\\x22cmd-pill\\\x22 style\x3d\\\x22margin-top:6px;\\\x22 onclick\x3d\\\x22copyEditorialCmd(\x27MENSAJE A LA DIRECCION: \x27)\\\x22\x3eMENSAJE A LA DIRECCION: \x5bsu consulta detallada\x5d\x3c\\\/span\x3e\x3cbr\x3e\\n          El sistema retransmite el mensaje a la consola ejecutiva teratura.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e2. SUSPENDIDO TEMPORALMENTE (24h, 48h o 72h):\x3c\\\/b\x3e Período de inhabilitación transitorio ante lenguaje inapropiado o faltas leves. El bot calcula el término y se reactiva automáticamente al vencer el plazo.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e3. BLOQUEADO INDEFINIDAMENTE:\x3c\\\/b\x3e Inhabilitación preventiva ante conductas reiteradas o desacato a las directrices, sujeto a valoración directa de la Dirección.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e4. EXPULSADO PERMANENTE:\x3c\\\/b\x3e Veto definitivo e irrevocable del número telefónico y registro ante intentos de vulneración o faltas graves. El sistema bloquea de raíz cualquier intento futuro de reincorporación.\x3c\\\/li\x3e\x3c\\\/ul\x3e\\\x22,\\n    \\\x22card_conduct_title\\\x22: \\\x22⛔ Régimen Disciplinario y Escala de Estatus Institucionales\\\x22,\\n    \\\x22card_crit_anti_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eCrecimiento Autónomo de la Colección:\x3c\\\/b\x3e Si durante el análisis se identifica que alguno de los artículos adjuntos no existe en la base de datos de la biblioteca, este \x3cb\x3eserá agregado al catálogo de forma automática\x3c\\\/b\x3e.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eEscudo Anti-Duplicación:\x3c\\\/b\x3e Si los documentos ya formaban parte de la información almacenada, se evita cualquier duplicación y el motor se limita estrictamente al análisis comparativo.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eEntregables:\x3c\\\/b\x3e Resumen PICO, metodología, significación estadística, riesgo de sesgos y \x3cb\x3eMatriz Comparativa Cruzada\x3c\\\/b\x3e.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_crit_anti_title\\\x22: \\\x22⚖️ Incorporación Automática y Anti-Duplicación\\\x22,\\n    \\\x22card_crit_flow_title\\\x22: \\\x22🔬 Flujo Guiado de Análisis Documental\\\x22,\\n    \\\x22card_donor_privacy\\\x22: \\\x22🔒 \x3cb\x3eRegistro de Control Interno Confidencial:\x3c\\\/b\x3e Los datos de los médicos donantes se asientan exclusivamente en una sección de registro privado para la Dirección. Nunca se publicará, expondrá ni informará qué usuario aportó determinada información.\\\x22,\\n    \\\x22card_evidence_results_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eResumen WhatsApp (3\\u20134 párrafos):\x3c\\\/b\x3e Consenso actual, hallazgos clave de los 3 estudios más recientes y recomendación quirúrgica.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eEnlaces HTTPS Directos:\x3c\\\/b\x3e Enlaces directos a PubMed, DOI y Consensus para leer el artículo original a texto completo.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eFicha de Evidencia PDF:\x3c\\\/b\x3e Documento clínico formal descargable generado bajo las reglas institucionales con tabla comparativa y escala Oxford de evidencia.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_evidence_results_title\\\x22: \\\x22📊 Entrega de Resultados Estructurados\\\x22,\\n    \\\x22card_lang_badge\\\x22: \\\x22MULTILINGÜISMO ILIMITADO\\\x22,\\n    \\\x22card_lang_comms_desc\\\x22: \\\x22Sin importar el idioma en que el \x3cb\x3eGestor de Contenido\x3c\\\/b\x3e redacte los comunicados institucionales o boletines, la plataforma realiza una traducción autónoma de alta fidelidad para que cada colega reciba el mensaje en su respectiva lengua preferida.\\\x22,\\n    \\\x22card_lang_comms_hdr\\\x22: \\\x22📢 Comunicados del Gestor de Contenido en su Idioma:\\\x22,\\n    \\\x22card_lang_desc\\\x22: \\\x22Con miras a la expansión internacional y al acompañamiento fraterno de la comunidad médica global, \x3cb\x3etodo usuario tiene la potestad de seleccionar el idioma en el cual desea interactuar con el asistente, recibir respuestas, síntesis de evidencia y comunicados oficiales\x3c\\\/b\x3e.\\\x22,\\n    \\\x22card_lang_preserve_desc\\\x22: \\\x22\x3cb\x3eLos artículos científicos, guías de técnica quirúrgica AO, libros de texto y monografías en formato PDF se preservan y descargan estrictamente en su idioma original de publicación\x3c\\\/b\x3e.\x3cbr\x3ePara garantizar la más estricta fidelidad anatómica, evitar ambigüedades en dosificaciones farmacológicas y respetar las indicaciones y marcas de implantes certificadas por casas matrices, \x3cb\x3elos documentos originales jamás se alteran ni se traducen de forma sintética\x3c\\\/b\x3e. Se entregan íntegros y auténticos tal como fueron concebidos por la literatura biomédica internacional.\\\x22,\\n    \\\x22card_lang_preserve_hdr\\\x22: \\\x22\x3cspan\x3e🛡️\x3c\\\/span\x3e Principio Fundamental de Preservación de la Originalidad Documental:\\\x22,\\n    \\\x22card_lang_switch_hdr\\\x22: \\\x22🔄 Actualización Inmediata y Sin Límites de Frecuencia:\\\x22,\\n    \\\x22card_large_files_desc\\\x22: \\\x22\x3cp\x3ePara atlas quirúrgicos completos, monografías enciclopédicas o tratados escaneados de alto volumen, el ecosistema cuenta con 4 estrategias de recepción optimizadas:\x3c\\\/p\x3e\x3cul style\x3d\\\\\\\x22margin-top: 8px;\\\\\\\x22\x3e\x3cli\x3e\x3cb\x3e1. Documento Adjunto por WhatsApp (Hasta 100 MB \\u2013 2 GB):\x3c\\\/b\x3e Puede adjuntar el archivo directamente en nuestro chat de WhatsApp junto con la palabra clave \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27APORTE\x27)\\\\\\\x22\x3eAPORTE\x3c\\\/span\x3e. La plataforma procesa la recepción en streaming continuo.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e2. Subida Fraccionada por Bloques (Chunked Upload):\x3c\\\/b\x3e En el Buzón Digital Web, los documentos pesados son divididos automáticamente en bloques de 10 MB a 15 MB transmitidos en secuencia con barra de progreso interactiva.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e3. Sesión Reanudable Efímera (Resumable Upload):\x3c\\\/b\x3e Enlace temporal con tolerancia a interrupciones de red que permite reanudar transferencias sin perder bytes ya transmitidos.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e4. Optimización y Recompresión en Navegador:\x3c\\\/b\x3e Ajuste dinámico de escaneos a 150\\u2013200 DPI clínicos de lectura en su propio dispositivo antes de enviar, reduciendo el peso hasta un 70% sin menoscabo visual.\x3c\\\/li\x3e\x3c\\\/ul\x3e\\\x22,\\n    \\\x22card_large_files_title\\\x22: \\\x22📦 Tratados Voluminosos y Archivos de Gran Tamaño (\x3e 45 MB hasta 2 GB)\\\x22,\\n    \\\x22card_learning_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eExpansión de Sinónimos:\x3c\\\/b\x3e Mapeo automático de términos equivalentes (ej. \x3ci\x3eprótesis \x26rarr; artroplastia \/ reemplazo; LCA \x26rarr; ligamento cruzado anterior\x3c\\\/i\x3e).\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eDetección de Brechas:\x3c\\\/b\x3e Las consultas que no arrojen resultados quedan registradas en la memoria de aprendizaje del sistema para orientar nuevas adquisiciones de literatura.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_learning_title\\\x22: \\\x22🧠 Sistema de Autoaprendizaje Continuo\\\x22,\\n    \\\x22card_msg_dir_desc\\\x22: \\\x22Para elevar sugerencias de literatura, reportar dudas o comunicarse formalmente con la Dirección sin vulnerar el anonimato bilateral, escriba en el chat:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27MENSAJE A LA DIRECCION: \x27)\\\\\\\x22\x3eMENSAJE A LA DIRECCION: \x5bsu consulta detallada\x5d\x3c\\\/span\x3e\x3cbr\x3eEl sistema retransmite el mensaje a la consola ejecutiva de forma confidencial.\\\x22,\\n    \\\x22card_msg_dir_title\\\x22: \\\x22📩 Envío de Mensaje a la Dirección\\\x22,\\n    \\\x22card_option_a_desc\\\x22: \\\x22Los colaboradores pueden depositar literatura médica de manera confidencial y blindada a través del portal institucional anónimo embebido, sin exponer cuentas personales ni interfaces externas.\\\x22,\\n    \\\x22card_option_a_title\\\x22: \\\x22📁 Opción A: Buzón Digital Seguro Web\\\x22,\\n    \\\x22card_option_b_desc\\\x22: \\\x22Los médicos autorizados pueden enviar directamente un archivo PDF al chat de WhatsApp acompañando el documento con el texto \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27APORTE\x27)\\\\\\\x22\x3eAPORTE\x3c\\\/span\x3e o \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27DONAR\x27)\\\\\\\x22\x3eDONAR\x3c\\\/span\x3e.\x3cbr\x3eEl asistente valida la integridad del archivo, lo cataloga por subespecialidad y le devuelve una confirmación formal con su identificador de indexación.\\\x22,\\n    \\\x22card_option_b_title\\\x22: \\\x22📱 Opción B: Ingesta Directa por WhatsApp\\\x22,\\n    \\\x22card_pubmed_desc\\\x22: \\\x22Permite interrogar en tiempo real más de 35 millones de publicaciones biomédicas indexadas. Para formular una consulta científica, escriba en el chat:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27EVIDENCIA: \x27)\\\\\\\x22\x3eEVIDENCIA: \x5bsu pregunta clínica o técnica\x5d\x3c\\\/span\x3e\x3cbr\x3e\x3ci\x3eEjemplo: \\\\\\\x22EVIDENCIA: Cerclaje vs placas bloqueadas en fracturas de rótula 34-C3\\\\\\\x22\x3c\\\/i\x3e\\\x22,\\n    \\\x22card_pubmed_title\\\x22: \\\x22🌐 Consulta Directa a PubMed\\\x22,\\n    \\\x22card_resp_dir_desc\\\x22: \\\x22Cuando la solicitud sea evaluada, el médico recibirá la comunicación directamente en su chat de WhatsApp con el encabezado oficial:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22\x3eDIRECCIÓN DEL PROYECTO: \x5brespuesta institucional\x5d\x3c\\\/span\x3e\x3cbr\x3eGarantizando un canal de comunicación transparente, ordenado y protegido.\\\x22,\\n    \\\x22card_resp_dir_title\\\x22: \\\x22📤 Recepción de Respuesta Oficial\\\x22,\\n    \\\x22card_status_notify\\\x22: \\\x22🔔 \x3cb\x3eProtocolo de Notificación Automática:\x3c\\\/b\x3e Cada vez que la Dirección modifica el estatus de un usuario (sea desde WhatsApp o en la hoja central), el sistema despacha de forma inmediata un mensaje oficial al usuario informándole de su nueva condición, causales y tiempo de vigencia.\\\x22,\\n    \\\x22card_step1_desc\\\x22: \\\x22El médico escribe al WhatsApp del bot indicando: \x3cb\x3eNombre Completo\x3c\\\/b\x3e, \x3cb\x3eCorreo electrónico (personal o institucional)\x3c\\\/b\x3e, \x3cb\x3eHospital o Universidad de formación\x3c\\\/b\x3e y \x3cb\x3eNivel actual\x3c\\\/b\x3e (R1\\u2013R4, Especialista, Egresado). El sistema registra la solicitud con estado \x3ccode\x3ePENDIENTE_APROBACION\x3c\\\/code\x3e y resguarda la información con sellado criptográfico en reposo.\\\x22,\\n    \\\x22card_step1_title\\\x22: \\\x221. Solicitud y Registro Inicial\\\x22,\\n    \\\x22card_step2_desc\\\x22: \\\x22Su solicitud es evaluada según parámetros preestablecidos de forma autónoma y conforme a los lineamientos del proyecto, luego de verificar la veracidad de la información en un período aproximado de \x3cb\x3e24 horas\x3c\\\/b\x3e.\\\x22,\\n    \\\x22card_step2_title\\\x22: \\\x222. Análisis y Verificación Autónoma\\\x22,\\n    \\\x22card_step3_desc\\\x22: \\\x22El usuario recibe su confirmación de bienvenida, el enlace al Manual Oficial interactivo y su cupo habilitado para realizar consultas y descargas clínicas 24\/7.\\\x22,\\n    \\\x22card_step3_title\\\x22: \\\x223. Acceso Pleno Inmediato\\\x22,\\n    \\\x22card_support_desc\\\x22: \\\x22Iniciativa médica independiente para fortalecer la formación continua de residentes y cirujanos ortopedistas. La literatura, guías y monografías provistas son de \x3cb\x3ecarácter estrictamente pedagógico\x3c\\\/b\x3e; toda decisión diagnóstica y terapéutica corresponde en exclusiva al criterio clínico del médico tratante.\\\x22,\\n    \\\x22card_support_title\\\x22: \\\x22🎯 Apoyo Médico y Exención de Responsabilidad\\\x22,\\n    \\\x22card_update_badge\\\x22: \\\x22AUTOGESTIÓN SEGURA\\\x22,\\n    \\\x22card_update_cmd_desc\\\x22: \\\x22Para consultar la guía de actualización, envíe simplemente: \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27ACTUALIZAR DATOS\x27)\\\\\\\x22\x3eACTUALIZAR DATOS\x3c\\\/span\x3e\x3cbr\x3eO transmita sus nuevos datos directamente en un solo mensaje estructurado:\x3cbr\x3e\x3ccode style\x3d\\\\\\\x22background: var(--slate-100); color: var(--color-primary); padding: 4px 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 8.2pt; display: inline-block; margin-top: 6px; border: 1px solid var(--slate-300);\\\\\\\x22\x3eACTUALIZAR: \x5bNombre Completo\x5d, \x5bCorreo\x5d, \x5bHospital\/Universidad\x5d, \x5bNivel\x5d\x3c\\\/code\x3e\\\x22,\\n    \\\x22card_update_cmd_hdr\\\x22: \\\x22Mecanismo y Comando de Activación por WhatsApp:\\\x22,\\n    \\\x22card_update_desc\\\x22: \\\x22En consonancia con los principios de autodeterminación informativa y calidad del registro médico institucional, \x3cb\x3etodo usuario tiene el derecho inalienable de solicitar la actualización o rectificación de sus datos personales en cualquier momento\x3c\\\/b\x3e (actualización de correo personal o institucional, cambio de hospital, ascenso de residencia de R1 a R4 o titulación de especialista).\\\x22,\\n    \\\x22card_update_limit_desc\\\x22: \\\x22Con el fin exclusivo de mantener la trazabilidad de los accesos clínicos, resguardar la identidad de los médicos participantes y prevenir la transferencia ilícita o fraudulenta de credenciales autorizadas, el sistema enforza automáticamente los siguientes límites temporales:\x3cbr\x3e\\u2022 \x3cb\x3eMáximo 3 actualizaciones en un periodo móvil de 6 meses\x3c\\\/b\x3e (180 días).\x3cbr\x3e\\u2022 \x3cb\x3eMáximo 6 actualizaciones en un periodo móvil de 12 meses\x3c\\\/b\x3e (365 días).\x3cbr\x3e\x3ci\x3eNota: Si por razones excepcionales de fuerza mayor requiere una rectificación adicional tras agotar dicho límite, puede remitir su solicitud formal a través del \x3ca href\x3d\\\\\\\x22#seccion-canal\\\\\\\x22 style\x3d\\\\\\\x22color: #92400e; font-weight: 700; text-decoration: underline;\\\\\\\x22\x3eCanal Intermediado con la Dirección\x3c\\\/a\x3e.\x3c\\\/i\x3e\\\x22,\\n    \\\x22card_update_limit_hdr\\\x22: \\\x22\x3cspan\x3e⏱️\x3c\\\/span\x3e Política Institucional de Frecuencia Máxima de Modificaciones:\\\x22,\\n    \\\x22card_vision_desc\\\x22: \\\x22Al adjuntar una radiografía o tomografía en el chat, el motor de visión computacional analiza el segmento óseo, sugiere la clasificación AO\/OTA preliminar más probable y recupera de forma proactiva la monografía y técnica quirúrgica correspondiente.\\\x22,\\n    \\\x22card_vision_title\\\x22: \\\x22📷 Orientación Radiográfica AO\/OTA\\\x22,\\n    \\\x22card_voice_desc\\\x22: \\\x22En áreas de lavado, consulta o quirófano, los cirujanos pueden enviar notas de voz al chat. El asistente procesa el audio multimodal con inteligencia artificial para transcribir con precisión la terminología ortopédica y ejecutar la búsqueda o lectura crítica sin necesidad de teclear.\\\x22,\\n    \\\x22card_voice_title\\\x22: \\\x22🎙️ Consultas por Nota de Voz\\\x22,\\n    \\\x22ch10_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e10\x3c\\\/span\x3e Gobernanza Dinámica: Comunicados Oficiales y Autoaprendizaje\\\x22,\\n    \\\x22ch11_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e🩺\x3c\\\/span\x3e Simulador Clínico Interactivo de WhatsApp en Tiempo Real\\\x22,\\n    \\\x22ch1_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e1\x3c\\\/span\x3e Filosofía Académica y Principio de Anonimato Cardinal\\\x22,\\n    \\\x22ch2_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e2\x3c\\\/span\x3e Protocolo de Admisión y Ciclo de Vida del Usuario\\\x22,\\n    \\\x22ch3_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e3\x3c\\\/span\x3e Modalidades de Búsqueda Quirúrgica en el Catálogo Especializado\\\x22,\\n    \\\x22ch4_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e4\x3c\\\/span\x3e Motor de Evidencia Médica Global (PubMed \x26 Semantic Scholar)\\\x22,\\n    \\\x22ch5_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e5\x3c\\\/span\x3e Lectura Crítica de Artículos Propios (Motor NotebookLM con Gemini)\\\x22,\\n    \\\x22ch6_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e6\x3c\\\/span\x3e Vías de Aporte y Enriquecimiento del Acervo Especializado\\\x22,\\n    \\\x22ch7_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e7\x3c\\\/span\x3e Potenciaciones Multimodales del Asistente: Voz, Visión AO y Boletín\\\x22,\\n    \\\x22ch8_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e8\x3c\\\/span\x3e Código de Conducta y Régimen Disciplinario Institucional\\\x22,\\n    \\\x22ch9_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e9\x3c\\\/span\x3e Canal Intermediado Confidencial con la Dirección\\\x22,\\n    \\\x22chip_bulletin\\\x22: \\\x22☀️ Boletín Dominical Quirúrgico\\\x22,\\n    \\\x22chip_multilingual\\\x22: \\\x22🌍 Cobertura Global Multilingüe\\\x22,\\n    \\\x22chip_notebooklm\\\x22: \\\x22🔬 Motor NotebookLM con Gemini\\\x22,\\n    \\\x22chip_pubmed\\\x22: \\\x22🌐 Motor PubMed \x26 Semantic Scholar\\\x22,\\n    \\\x22chip_service\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22pulse-dot\\\\\\\x22\x3e\x3c\\\/span\x3e Servicio Clínico 24\/7 Disponible\\\x22,\\n    \\\x22chip_vision\\\x22: \\\x22📷 Visión Radiográfica AO\/OTA\\\x22,\\n    \\\x22chip_voice\\\x22: \\\x22🎙️ Consultas por Audio \/ Voz\\\x22,\\n    \\\x22custody_identity\\\x22: \\\x22🏛️ Gestor de Contenido\\\x22,\\n    \\\x22custody_label\\\x22: \\\x22DIRECCIÓN \x26 CUSTODIA\\\x22,\\n    \\\x22diag2_caption\\\x22: \\\x22Esquema 2.1 \\u2014 Flujo Autónomo de Admisión y Habilitación de Acceso\\\x22,\\n    \\\x22diag3_caption\\\x22: \\\x22Esquema 3.1 \\u2014 Pipeline de Recuperación Inteligente y Despacho Clínico\\\x22,\\n    \\\x22diag4_caption\\\x22: \\\x22Esquema 4.1 \\u2014 Traducción Médica y Recuperación de Evidencia Científica\\\x22,\\n    \\\x22diag6_caption\\\x22: \\\x22Esquema 6.1 \\u2014 Ciclo Autónomo de Enriquecimiento e Ingesta Colaborativa\\\x22,\\n    \\\x22edition_tag\\\x22: \\\x22Edición Oficial 2026.5 \\u2022 Guía Operativa Institucional\\\x22,\\n    \\\x22footer_edition\\\x22: \\\x22\x3cspan\x3eDocumento Maestro Vivo \\u2022 Edición Oficial v2026.5\x3c\\\/span\x3e\x3cbr\x3e\x3cspan style\x3d\\\\\\\x22color: var(--color-surgical-teal); font-weight: 700;\\\\\\\x22\x3eVigencia Activa y Actualización Permanente\x3c\\\/span\x3e\\\x22,\\n    \\\x22footer_org\\\x22: \\\x22\x3cb\x3eBiblioteca Médica Especializada de Ortopedia y Traumatología\x3c\\\/b\x3e\x3cbr\x3eDirección Institucional: \x3cb\x3eDirección del Proyecto\x3c\\\/b\x3e \\u2022 Servicio Clínico Permanente 24\/7\\\x22,\\n    \\\x22lang_label\\\x22: \\\x22IDIOMA:\\\x22,\\n    \\\x22masthead_subtitle\\\x22: \\\x22Cirugía Ortopédica y Traumatología \\u2022 Guía Maestra de Uso, Procedimientos y Gobernanza\\\x22,\\n    \\\x22masthead_title\\\x22: \\\x22Biblioteca Médica Especializada\\\x22,\\n    \\\x22search_placeholder\\\x22: \\\x22Buscar temas (ej. AO, abordaje, PubMed, análisis)...\\\x22,\\n    \\\x22sim_header_hint\\\x22: \\\x22Haga clic en un comando para observar la respuesta del Asistente:\\\x22,\\n    \\\x22sim_header_tag\\\x22: \\\x22⚡ Consola de Demostración en Vivo\\\x22,\\n    \\\x22svg_step1_desc\\\x22: \\\x22Nombre, Correo, Hospital y Nivel\\\x22,\\n    \\\x22svg_step1_tag\\\x22: \\\x22PASO 01: SOLICITUD\\\x22,\\n    \\\x22svg_step1_title\\\x22: \\\x22Registro por WhatsApp\\\x22,\\n    \\\x22svg_step2_desc\\\x22: \\\x22Verificación de veracidad (~24 h)\\\x22,\\n    \\\x22svg_step2_tag\\\x22: \\\x22PASO 02: VALIDACIÓN\\\x22,\\n    \\\x22svg_step2_title\\\x22: \\\x22Evaluación Autónoma\\\x22,\\n    \\\x22svg_step3_desc\\\x22: \\\x22Bienvenida, Manual y Consultas 24\/7\\\x22,\\n    \\\x22svg_step3_tag\\\x22: \\\x22PASO 03: HABILITACIÓN\\\x22,\\n    \\\x22svg_step3_title\\\x22: \\\x22Acceso Pleno Inmediato\\\x22,\\n    \\\x22t_row1_mod\\\x22: \\\x22\x3cb\x3e🦴 Patología o Técnica\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row1_res\\\x22: \\\x22Tratados, monografías y técnicas de abordaje, implantes y biomecánica.\\\x22,\\n    \\\x22t_row2_mod\\\x22: \\\x22\x3cb\x3e🎯 Clasificación AO\/OTA \x26 Epónimos\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row2_res\\\x22: \\\x22Técnicas de reducción, principios biológicos y selección de implantes de osteosíntesis.\\\x22,\\n    \\\x22t_row3_mod\\\x22: \\\x22\x3cb\x3e🔪 Abordajes Quirúrgicos\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row3_res\\\x22: \\\x22Planos internerviosos, anatomía aplicada y pasos de disección quirúrgica.\\\x22,\\n    \\\x22t_row4_mod\\\x22: \\\x22\x3cb\x3e🔩 Instrumental y Marcas\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row4_res\\\x22: \\\x22Guías oficiales de técnica quirúrgica del fabricante con instrumental paso a paso.\\\x22,\\n    \\\x22t_row5_mod\\\x22: \\\x22\x3cb\x3e📄 Código DOI, PMID o ISBN\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row5_res\\\x22: \\\x22Entrega directa del artículo o apertura automática de ticket de adquisición.\\\x22,\\n    \\\x22t_row6_mod\\\x22: \\\x22\x3cb\x3e🔤 Tolerancia a Errores (Fuzzy)\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row6_res\\\x22: \\\x22Recuperación precisa a pesar de digitación rápida, faltas ortográficas o ausencia de tildes.\\\x22,\\n    \\\x22t_row7_mod\\\x22: \\\x22\x3cb\x3e🎙️ Consultas por Audio \/ Voz\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row7_res\\\x22: \\\x22Transcripción de terminología quirúrgica y ejecución automática de la consulta.\\\x22,\\n    \\\x22t_row8_mod\\\x22: \\\x22\x3cb\x3e📑 Menú de Especialidades\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row8_res\\\x22: \\\x22Despliegue del catálogo clasificado por subespecialidades ortopédicas.\\\x22,\\n    \\\x22t_row9_mod\\\x22: \\\x22\x3cb\x3e📖 Solicitud del Manual\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row9_res\\\x22: \\\x22Despacho instantáneo del enlace interactivo web y PDF del manual oficial.\\\x22,\\n    \\\x22th_example\\\x22: \\\x22Mensaje de Ejemplo en el Chat\\\x22,\\n    \\\x22th_modality\\\x22: \\\x22Modalidad de Búsqueda\\\x22,\\n    \\\x22th_result\\\x22: \\\x22Resultado Clínico Entregado\\\x22,\\n    \\\x22toast_copy\\\x22: \\\x22¡Comando copiado al portapapeles!\\\x22\\n  \x7d,\\n  \\\x22EN\\\x22: \x7b\\n    \\\x22btn_buzon\\\x22: \\\x22📤 Digital Mailbox\\\x22,\\n    \\\x22btn_buzon_share\\\x22: \\\x22📤 Share Literature in the Digital Mailbox\\\x22,\\n    \\\x22btn_print\\\x22: \\\x22🖨️ Print \/ Save PDF\\\x22,\\n    \\\x22btn_sim\\\x22: \\\x22🩺 WhatsApp Simulator\\\x22,\\n    \\\x22card_anon_desc\\\x22: \\\x22The project unwaveringly protects the privacy of Leadership and authorized users. All requests, intermediaries, and responses operate through the autonomous assistant with end-to-end encryption, preserving bilateral anonymity and confidentiality at all times.\\\x22,\\n    \\\x22card_anon_title\\\x22: \\\x22🛡️ Sacred Rule of Cardinal Anonymity\\\x22,\\n    \\\x22card_bulletin_desc\\\x22: \\\x22Every Sunday at 8:00 AM (or upon official request), authorized physicians receive an editorial digest featuring 3 surgical pearls and featured weekly literature for academic discussion at Grand Rounds.\\\x22,\\n    \\\x22card_bulletin_title\\\x22: \\\x22☀️ Sunday Surgical Update Bulletin\\\x22,\\n    \\\x22card_comms_desc\\\x22: \\\x22For system improvements, new features, or policy updates, an \x3cb\x3eofficial broadcast announcement\x3c\\\/b\x3e is dispatched to all authorized physicians via WhatsApp, ensuring timely and consistent updates.\\\x22,\\n    \\\x22card_comms_title\\\x22: \\\x22📢 Official Institutional Announcements\\\x22,\\n    \\\x22card_conduct_desc\\\x22: \\\x22\x3cp style\x3d\\\\\\\x22margin-bottom:8px;\\\\\\\x22\x3eThe library is an instrument of strict scientific and ethical rigor. Leadership manages participant status through a \x3cb\x3etiered disciplinary scale\x3c\\\/b\x3e adjustable via WhatsApp or directly in the control sheet:\x3c\\\/p\x3e\x3cul style\x3d\\\\\\\x22margin-bottom: 12px;\\\\\\\x22\x3e\x3cli\x3e\x3cb\x3e1. ACTIVE (Fully Enabled):\x3c\\\/b\x3e Regular access to searches, NotebookLM critical analysis, PubMed syntheses, and literature requests.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e2. TEMPORARILY SUSPENDED (24h, 48h, or 72h):\x3c\\\/b\x3e Transitory cooling-off period for inappropriate conduct or minor infractions. The bot reactivates automatically upon expiration.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e3. INDEFINITELY BLOCKED:\x3c\\\/b\x3e Preventive disabling for repeated offenses, subject to direct review by Leadership.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e4. PERMANENTLY EXPELLED:\x3c\\\/b\x3e Definitive and irrevocable ban of phone number and registration following security breach attempts or severe misconduct.\x3c\\\/li\x3e\x3c\\\/ul\x3e\\\x22,\\n    \\\x22card_conduct_title\\\x22: \\\x22⛔ Disciplinary Framework \x26 Institutional Status Scale\\\x22,\\n    \\\x22card_crit_anti_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eAutonomous Collection Growth:\x3c\\\/b\x3e If during analysis an attached paper is not found in the library database, it is \x3cb\x3eautomatically added to the catalog\x3c\\\/b\x3e.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eAnti-Duplication Shield:\x3c\\\/b\x3e If the files already exist in storage, duplication is prevented and the engine focuses purely on comparative analysis.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eDeliverables:\x3c\\\/b\x3e PICO summary, methodology, statistical significance, bias risk, and \x3cb\x3eCross-Comparative Matrix\x3c\\\/b\x3e.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_crit_anti_title\\\x22: \\\x22⚖️ Automatic Incorporation \x26 Anti-Duplication\\\x22,\\n    \\\x22card_crit_flow_title\\\x22: \\\x22🔬 Guided Document Analysis Workflow\\\x22,\\n    \\\x22card_donor_privacy\\\x22: \\\x22🔒 \x3cb\x3eConfidential Internal Record:\x3c\\\/b\x3e Donor physician data is recorded exclusively in a private leadership log. The identity of contributors will never be published, exposed, or revealed.\\\x22,\\n    \\\x22card_evidence_results_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eWhatsApp Summary (3\\u20134 paragraphs):\x3c\\\/b\x3e Current consensus, key findings from the 3 latest studies, and surgical recommendations.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eDirect HTTPS Links:\x3c\\\/b\x3e Direct links to PubMed, DOI, and Consensus to read the full original article.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3ePDF Evidence Brief:\x3c\\\/b\x3e Formal downloadable clinical document generated under institutional rules with comparative table and Oxford evidence scale.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_evidence_results_title\\\x22: \\\x22📊 Structured Results Delivery\\\x22,\\n    \\\x22card_lang_badge\\\x22: \\\x22UNLIMITED MULTILINGUALISM\\\x22,\\n    \\\x22card_lang_comms_desc\\\x22: \\\x22Regardless of the language in which the \x3cb\x3eContent Manager\x3c\\\/b\x3e drafts official communiqués or bulletins, the platform automatically performs high-fidelity translation so each colleague receives the bulletin in their chosen language.\\\x22,\\n    \\\x22card_lang_comms_hdr\\\x22: \\\x22📢 Content Manager Announcements in Your Language:\\\x22,\\n    \\\x22card_lang_desc\\\x22: \\\x22To support international expansion and foster fraternity across the global medical community, \x3cb\x3eevery user has full autonomy to choose the language used for bot interactions, replies, evidence digests, and administrative bulletins\x3c\\\/b\x3e.\\\x22,\\n    \\\x22card_lang_preserve_desc\\\x22: \\\x22\x3cb\x3eScientific papers, AO surgical technique guides, textbooks, and monographs in PDF format are strictly preserved and downloaded in their original language of publication\x3c\\\/b\x3e.\x3cbr\x3eTo ensure absolute anatomical accuracy, prevent pharmacological dosage ambiguities, and respect certified implant trademarks, \x3cb\x3eoriginal medical documents are never synthetically altered or translated\x3c\\\/b\x3e. They are delivered authentic and intact as published in international biomedical literature.\\\x22,\\n    \\\x22card_lang_preserve_hdr\\\x22: \\\x22\x3cspan\x3e🛡️\x3c\\\/span\x3e Fundamental Principle of Document Originality Preservation:\\\x22,\\n    \\\x22card_lang_switch_hdr\\\x22: \\\x22🔄 Instant Updates with No Frequency Limits:\\\x22,\\n    \\\x22card_large_files_desc\\\x22: \\\x22\x3cp\x3eFor comprehensive surgical atlases, encyclopedic monographs, or high-volume scanned treatises, the ecosystem features 4 optimized reception strategies:\x3c\\\/p\x3e\x3cul style\x3d\\\\\\\x22margin-top: 8px;\\\\\\\x22\x3e\x3cli\x3e\x3cb\x3e1. WhatsApp Attachment (Up to 100 MB \\u2013 2 GB):\x3c\\\/b\x3e Attach the file directly in WhatsApp with the keyword \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27CONTRIBUTE\x27)\\\\\\\x22\x3eCONTRIBUTE\x3c\\\/span\x3e. The platform handles continuous streaming reception.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e2. Chunked Upload:\x3c\\\/b\x3e In the Web Digital Mailbox, heavy files are automatically split into 10 MB to 15 MB chunks transmitted sequentially with an interactive progress bar.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e3. Ephemeral Resumable Upload:\x3c\\\/b\x3e Temporary link with network interruption tolerance enabling transfers to resume without losing bytes already sent.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e4. In-Browser Optimization:\x3c\\\/b\x3e Dynamic scan adjustment to 150\\u2013200 clinical reading DPI on your device before sending, cutting weight up to 70% with zero visual compromise.\x3c\\\/li\x3e\x3c\\\/ul\x3e\\\x22,\\n    \\\x22card_large_files_title\\\x22: \\\x22📦 Bulky Treatises \x26 Large Files (\x3e 45 MB up to 2 GB)\\\x22,\\n    \\\x22card_learning_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eSynonym Expansion:\x3c\\\/b\x3e Automatic mapping of equivalent clinical terms (e.g., \x3ci\x3eprosthesis \x26rarr; arthroplasty \/ replacement; ACL \x26rarr; anterior cruciate ligament\x3c\\\/i\x3e).\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eGap Detection:\x3c\\\/b\x3e Queries yielding no results are logged in system memory to guide upcoming literature acquisitions.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_learning_title\\\x22: \\\x22🧠 Continuous Self-Learning System\\\x22,\\n    \\\x22card_msg_dir_desc\\\x22: \\\x22To submit literature suggestions, report questions, or contact Leadership confidentially without breaking bilateral anonymity, type in chat:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27MESSAGE TO LEADERSHIP: \x27)\\\\\\\x22\x3eMESSAGE TO LEADERSHIP: \x5bdetailed inquiry\x5d\x3c\\\/span\x3e\x3cbr\x3eThe system securely forwards the inquiry to the executive console.\\\x22,\\n    \\\x22card_msg_dir_title\\\x22: \\\x22📩 Sending a Message to Leadership\\\x22,\\n    \\\x22card_option_a_desc\\\x22: \\\x22Collaborators can deposit medical literature confidentially through the anonymous embedded institutional portal, without exposing personal accounts or external interfaces.\\\x22,\\n    \\\x22card_option_a_title\\\x22: \\\x22📁 Option A: Secure Web Digital Mailbox\\\x22,\\n    \\\x22card_option_b_desc\\\x22: \\\x22Authorized physicians can send a PDF directly to WhatsApp accompanied by the keyword \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27CONTRIBUTE\x27)\\\\\\\x22\x3eCONTRIBUTE\x3c\\\/span\x3e or \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27DONATE\x27)\\\\\\\x22\x3eDONATE\x3c\\\/span\x3e.\x3cbr\x3eThe assistant validates file integrity, catalogs it by subspecialty, and returns formal confirmation with indexing ID.\\\x22,\\n    \\\x22card_option_b_title\\\x22: \\\x22📱 Option B: Direct WhatsApp Ingestion\\\x22,\\n    \\\x22card_pubmed_desc\\\x22: \\\x22Enables real-time querying of over 35 million indexed biomedical publications. To formulate a scientific query, write in the chat:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27EVIDENCE: \x27)\\\\\\\x22\x3eEVIDENCE: \x5byour clinical or technical question\x5d\x3c\\\/span\x3e\x3cbr\x3e\x3ci\x3eExample: \\\\\\\x22EVIDENCE: Tension band vs locked plates in patellar fracture 34-C3\\\\\\\x22\x3c\\\/i\x3e\\\x22,\\n    \\\x22card_pubmed_title\\\x22: \\\x22🌐 Direct Query to PubMed\\\x22,\\n    \\\x22card_resp_dir_desc\\\x22: \\\x22Once evaluated, the physician receives the official decision directly in WhatsApp with the institutional header:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22\x3ePROJECT LEADERSHIP: \x5binstitutional reply\x5d\x3c\\\/span\x3e\x3cbr\x3eEnsuring a transparent, orderly, and protected communication channel.\\\x22,\\n    \\\x22card_resp_dir_title\\\x22: \\\x22📤 Receiving an Official Response\\\x22,\\n    \\\x22card_status_notify\\\x22: \\\x22🔔 \x3cb\x3eAutomatic Notification Protocol:\x3c\\\/b\x3e Whenever Leadership modifies a user status, the system immediately dispatches an official message detailing the new status, reasons, and duration.\\\x22,\\n    \\\x22card_step1_desc\\\x22: \\\x22The physician contacts the bot WhatsApp stating: \x3cb\x3eFull Name\x3c\\\/b\x3e, \x3cb\x3eEmail (personal or institutional)\x3c\\\/b\x3e, \x3cb\x3eTraining Hospital or University\x3c\\\/b\x3e and \x3cb\x3eCurrent Level\x3c\\\/b\x3e (R1\\u2013R4, Specialist, Alumni). The system records the request with status \x3ccode\x3ePENDING_APPROVAL\x3c\\\/code\x3e and protects information with cryptographic sealing at rest.\\\x22,\\n    \\\x22card_step1_title\\\x22: \\\x221. Initial Request \x26 Registration\\\x22,\\n    \\\x22card_step2_desc\\\x22: \\\x22The application is evaluated based on pre-established parameters autonomously and in accordance with project guidelines, following factual verification over approximately \x3cb\x3e24 hours\x3c\\\/b\x3e.\\\x22,\\n    \\\x22card_step2_title\\\x22: \\\x222. Autonomous Analysis \x26 Verification\\\x22,\\n    \\\x22card_step3_desc\\\x22: \\\x22The user receives a welcome confirmation, link to the interactive Official Manual, and full 24\/7 quota to perform clinical queries and literature downloads.\\\x22,\\n    \\\x22card_step3_title\\\x22: \\\x223. Immediate Full Access\\\x22,\\n    \\\x22card_support_desc\\\x22: \\\x22Independent medical initiative to strengthen continuous training for orthopedic residents and surgeons. All literature, guides, and monographs provided are strictly for \x3cb\x3eeducational purposes\x3c\\\/b\x3e; every diagnostic and therapeutic decision is the sole clinical responsibility of the treating physician.\\\x22,\\n    \\\x22card_support_title\\\x22: \\\x22🎯 Medical Support \x26 Disclaimer\\\x22,\\n    \\\x22card_update_badge\\\x22: \\\x22SECURE SELF-MANAGEMENT\\\x22,\\n    \\\x22card_update_cmd_desc\\\x22: \\\x22To view the update guide, simply send: \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27UPDATE DATA\x27)\\\\\\\x22\x3eUPDATE DATA\x3c\\\/span\x3e\x3cbr\x3eOr submit your new information in a single structured message:\x3cbr\x3e\x3ccode style\x3d\\\\\\\x22background: var(--slate-100); color: var(--color-primary); padding: 4px 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 8.2pt; display: inline-block; margin-top: 6px; border: 1px solid var(--slate-300);\\\\\\\x22\x3eUPDATE: \x5bFull Name\x5d, \x5bEmail\x5d, \x5bHospital\/University\x5d, \x5bLevel\x5d\x3c\\\/code\x3e\\\x22,\\n    \\\x22card_update_cmd_hdr\\\x22: \\\x22WhatsApp Activation Mechanism \x26 Command:\\\x22,\\n    \\\x22card_update_desc\\\x22: \\\x22In accordance with information self-determination principles and institutional medical record standards, \x3cb\x3eevery user has the inalienable right to request updates or corrections of personal data at any time\x3c\\\/b\x3e (email update, hospital transfer, residency promotion R1 to R4, or specialist certification).\\\x22,\\n    \\\x22card_update_limit_desc\\\x22: \\\x22Exclusively to preserve auditability of clinical access, protect physician identity, and prevent illicit credential transfers, the system enforces the following limits:\x3cbr\x3e\\u2022 \x3cb\x3eMaximum 3 updates in a rolling 6-month period\x3c\\\/b\x3e (180 days).\x3cbr\x3e\\u2022 \x3cb\x3eMaximum 6 updates in a rolling 12-month period\x3c\\\/b\x3e (365 days).\x3cbr\x3e\x3ci\x3eNote: Exceptional cases may submit a formal request via the \x3ca href\x3d\\\\\\\x22#seccion-canal\\\\\\\x22 style\x3d\\\\\\\x22color: #92400e; font-weight: 700; text-decoration: underline;\\\\\\\x22\x3eIntermediated Channel with Leadership\x3c\\\/a\x3e.\x3c\\\/i\x3e\\\x22,\\n    \\\x22card_update_limit_hdr\\\x22: \\\x22\x3cspan\x3e⏱️\x3c\\\/span\x3e Institutional Policy on Maximum Modification Frequency:\\\x22,\\n    \\\x22card_vision_desc\\\x22: \\\x22When an X-ray or CT scan is attached in chat, the computer vision engine analyzes the bone segment, suggests the most probable preliminary AO\/OTA classification, and proactively retrieves the surgical technique.\\\x22,\\n    \\\x22card_vision_title\\\x22: \\\x22📷 AO\/OTA Radiographic Guidance\\\x22,\\n    \\\x22card_voice_desc\\\x22: \\\x22In scrub rooms, outpatient clinics, or operating theaters, surgeons can send voice notes. The assistant processes multimodal audio with AI to accurately transcribe orthopedic terminology and execute queries hands-free.\\\x22,\\n    \\\x22card_voice_title\\\x22: \\\x22🎙️ Voice Note Inquiries\\\x22,\\n    \\\x22ch10_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e10\x3c\\\/span\x3e Dynamic Governance: Official Announcements \x26 Continuous Learning\\\x22,\\n    \\\x22ch11_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e🩺\x3c\\\/span\x3e Interactive WhatsApp Clinical Simulator in Real Time\\\x22,\\n    \\\x22ch1_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e1\x3c\\\/span\x3e Academic Philosophy and Cardinal Anonymity Principle\\\x22,\\n    \\\x22ch2_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e2\x3c\\\/span\x3e Admission Protocol and User Lifecycle\\\x22,\\n    \\\x22ch3_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e3\x3c\\\/span\x3e Surgical Search Modalities in the Specialized Catalog\\\x22,\\n    \\\x22ch4_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e4\x3c\\\/span\x3e Global Medical Evidence Engine (PubMed \x26 Semantic Scholar)\\\x22,\\n    \\\x22ch5_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e5\x3c\\\/span\x3e Critical Reading of Own Articles (NotebookLM Engine with Gemini)\\\x22,\\n    \\\x22ch6_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e6\x3c\\\/span\x3e Channels for Contribution \x26 Enrichment of the Collection\\\x22,\\n    \\\x22ch7_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e7\x3c\\\/span\x3e Multimodal Enhancements: Voice, AO Vision \x26 Bulletin\\\x22,\\n    \\\x22ch8_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e8\x3c\\\/span\x3e Code of Conduct and Institutional Disciplinary Framework\\\x22,\\n    \\\x22ch9_title\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22chapter-badge\\\\\\\x22\x3e9\x3c\\\/span\x3e Confidential Intermediated Channel with Leadership\\\x22,\\n    \\\x22chip_bulletin\\\x22: \\\x22☀️ Sunday Surgical Bulletin\\\x22,\\n    \\\x22chip_multilingual\\\x22: \\\x22🌍 Global Multilingual Coverage\\\x22,\\n    \\\x22chip_notebooklm\\\x22: \\\x22🔬 NotebookLM Engine with Gemini\\\x22,\\n    \\\x22chip_pubmed\\\x22: \\\x22🌐 PubMed \x26 Semantic Scholar Engine\\\x22,\\n    \\\x22chip_service\\\x22: \\\x22\x3cspan class\x3d\\\\\\\x22pulse-dot\\\\\\\x22\x3e\x3c\\\/span\x3e 24\/7 Clinical Service Available\\\x22,\\n    \\\x22chip_vision\\\x22: \\\x22📷 AO\/OTA Radiographic Vision\\\x22,\\n    \\\x22chip_voice\\\x22: \\\x22🎙️ Audio \/ Voice Inquiries\\\x22,\\n    \\\x22custody_identity\\\x22: \\\x22🏛️ Content Manager\\\x22,\\n    \\\x22custody_label\\\x22: \\\x22LEADERSHIP \x26 CUSTODY\\\x22,\\n    \\\x22diag2_caption\\\x22: \\\x22Diagram 2.1 \\u2014 Autonomous Admission and Access Enablement Flow\\\x22,\\n    \\\x22diag3_caption\\\x22: \\\x22Diagram 3.1 \\u2014 Intelligent Retrieval Pipeline and Clinical Dispatch\\\x22,\\n    \\\x22diag4_caption\\\x22: \\\x22Diagram 4.1 \\u2014 Medical Translation and Scientific Evidence Retrieval\\\x22,\\n    \\\x22diag6_caption\\\x22: \\\x22Diagram 6.1 \\u2014 Autonomous Enrichment Cycle \x26 Collaborative Ingestion\\\x22,\\n    \\\x22edition_tag\\\x22: \\\x22Official Edition 2026.5 \\u2022 Institutional Operational Guide\\\x22,\\n    \\\x22footer_edition\\\x22: \\\x22\x3cspan\x3eLiving Master Document \\u2022 Official Edition v2026.5\x3c\\\/span\x3e\x3cbr\x3e\x3cspan style\x3d\\\\\\\x22color: var(--color-surgical-teal); font-weight: 700;\\\\\\\x22\x3eActive Validity and Continuous Updating\x3c\\\/span\x3e\\\x22,\\n    \\\x22footer_org\\\x22: \\\x22\x3cb\x3eSpecialized Medical Library of Orthopedics \x26 Traumatology\x3c\\\/b\x3e\x3cbr\x3eInstitutional Custody: \x3cb\x3eProject Leadership\x3c\\\/b\x3e \\u2022 Continuous 24\/7 Clinical Service\\\x22,\\n    \\\x22lang_label\\\x22: \\\x22LANGUAGE:\\\x22,\\n    \\\x22masthead_subtitle\\\x22: \\\x22Orthopedic Surgery \x26 Traumatology \\u2022 Master Guide for Usage, Procedures and Governance\\\x22,\\n    \\\x22masthead_title\\\x22: \\\x22Specialized Medical Library\\\x22,\\n    \\\x22search_placeholder\\\x22: \\\x22Search topics (e.g., AO, approach, PubMed, analysis)...\\\x22,\\n    \\\x22sim_header_hint\\\x22: \\\x22Click on any command to preview the Assistant response:\\\x22,\\n    \\\x22sim_header_tag\\\x22: \\\x22⚡ Live Demonstration Console\\\x22,\\n    \\\x22svg_step1_desc\\\x22: \\\x22Name, Email, Hospital \x26 Level\\\x22,\\n    \\\x22svg_step1_tag\\\x22: \\\x22STEP 01: REQUEST\\\x22,\\n    \\\x22svg_step1_title\\\x22: \\\x22Registration via WhatsApp\\\x22,\\n    \\\x22svg_step2_desc\\\x22: \\\x22Factual verification (~24 h)\\\x22,\\n    \\\x22svg_step2_tag\\\x22: \\\x22STEP 02: VALIDATION\\\x22,\\n    \\\x22svg_step2_title\\\x22: \\\x22Autonomous Evaluation\\\x22,\\n    \\\x22svg_step3_desc\\\x22: \\\x22Welcome, Manual \x26 24\/7 Queries\\\x22,\\n    \\\x22svg_step3_tag\\\x22: \\\x22STEP 03: ACCESS ENABLED\\\x22,\\n    \\\x22svg_step3_title\\\x22: \\\x22Immediate Full Access\\\x22,\\n    \\\x22t_row1_mod\\\x22: \\\x22\x3cb\x3e🦴 Pathology or Technique\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row1_res\\\x22: \\\x22Treatises, monographs, surgical approaches, implants, and biomechanics.\\\x22,\\n    \\\x22t_row2_mod\\\x22: \\\x22\x3cb\x3e🎯 AO\/OTA Classification \x26 Eponyms\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row2_res\\\x22: \\\x22Reduction techniques, biological principles, and osteosynthesis implant selection.\\\x22,\\n    \\\x22t_row3_mod\\\x22: \\\x22\x3cb\x3e🔪 Surgical Approaches\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row3_res\\\x22: \\\x22Internervous planes, applied anatomy, and step-by-step dissection pearls.\\\x22,\\n    \\\x22t_row4_mod\\\x22: \\\x22\x3cb\x3e🔩 Instruments \x26 Brands\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row4_res\\\x22: \\\x22Official manufacturer surgical technique guides with instrumentation steps.\\\x22,\\n    \\\x22t_row5_mod\\\x22: \\\x22\x3cb\x3e📄 DOI, PMID or ISBN Code\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row5_res\\\x22: \\\x22Direct delivery of scientific paper or automatic acquisition ticket creation.\\\x22,\\n    \\\x22t_row6_mod\\\x22: \\\x22\x3cb\x3e🔤 Error Tolerance (Fuzzy Search)\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row6_res\\\x22: \\\x22Precise retrieval despite quick typing, misspellings, or missing accents.\\\x22,\\n    \\\x22t_row7_mod\\\x22: \\\x22\x3cb\x3e🎙️ Audio \/ Voice Inquiries\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row7_res\\\x22: \\\x22Transcription of orthopedic terminology and automatic query execution.\\\x22,\\n    \\\x22t_row8_mod\\\x22: \\\x22\x3cb\x3e📑 Specialties Menu\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row8_res\\\x22: \\\x22Display of catalog organized by orthopedic subspecialties.\\\x22,\\n    \\\x22t_row9_mod\\\x22: \\\x22\x3cb\x3e📖 Manual Request\x3c\\\/b\x3e\\\x22,\\n    \\\x22t_row9_res\\\x22: \\\x22Instant delivery of the interactive web link and official manual PDF.\\\x22,\\n    \\\x22th_example\\\x22: \\\x22Example Chat Message\\\x22,\\n    \\\x22th_modality\\\x22: \\\x22Search Modality\\\x22,\\n    \\\x22th_result\\\x22: \\\x22Clinical Result Delivered\\\x22,\\n    \\\x22toast_copy\\\x22: \\\x22Command copied to clipboard!\\\x22\\n  \x7d,\\n  \\\x22PT\\\x22: \x7b\\n    \\\x22btn_buzon\\\x22: \\\x22📤 Caixa Digital\\\x22,\\n    \\\x22btn_buzon_share\\\x22: \\\x22📤 Compartilhe Literatura na Caixa Digital\\\x22,\\n    \\\x22btn_print\\\x22: \\\x22🖨️ Imprimir \/ Salvar PDF\\\x22,\\n    \\\x22btn_sim\\\x22: \\\x22🩺 Simulador WhatsApp\\\x22,\\n    \\\x22card_anon_desc\\\x22: \\\x22O projeto protege com zelo inabalável a privacidade da Direção e dos usuários autorizados. Todas as solicitações, intermediações e respostas operam por meio do assistente autônomo com criptografia de ponta a ponta, preservando em todos os momentos o anonimato e a confidencialidade bilateral.\\\x22,\\n    \\\x22card_anon_title\\\x22: \\\x22🛡️ Regra Sagrada do Anonimato Cardinal\\\x22,\\n    \\\x22card_bulletin_desc\\\x22: \\\x22Todo domingo às 8h00 (ou sob solicitação oficial), os médicos recebem um resumo editorial com 3 pérolas cirúrgicas e leituras destacadas da semana para debate em reuniões clínicas.\\\x22,\\n    \\\x22card_bulletin_title\\\x22: \\\x22☀️ Boletim Dominical Cirúrgico\\\x22,\\n    \\\x22card_comms_desc\\\x22: \\\x22Para atualizações, novidades no acervo ou avisos regimentais, é emitido um \x3cb\x3ecomunicado oficial direto\x3c\\\/b\x3e a todos os médicos autorizados pelo assistente, garantindo ampla e simultânea informação.\\\x22,\\n    \\\x22card_comms_title\\\x22: \\\x22📢 Comunicados Institucionais Oficiais\\\x22,\\n    \\\x22card_conduct_desc\\\x22: \\\x22\x3cp style\x3d\\\\\\\x22margin-bottom:8px;\\\\\\\x22\x3eA biblioteca opera com estrito rigor científico e ético. A Direção gerencia a condição de cada participante por meio de uma \x3cb\x3eescala disciplinar escalonada\x3c\\\/b\x3e ajustável via WhatsApp ou na planilha de controle:\x3c\\\/p\x3e\x3cul style\x3d\\\\\\\x22margin-bottom: 12px;\\\\\\\x22\x3e\x3cli\x3e\x3cb\x3e1. ATIVO (Habilitado Pleno):\x3c\\\/b\x3e Acesso regular a buscas, leitura crítica NotebookLM, sínteses PubMed e requisições de literatura.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e2. SUSPENSO TEMPORARIAMENTE (24h, 48h ou 72h):\x3c\\\/b\x3e Período de suspensão preventiva para conduta inadequada ou faltas leves. Reativação automática ao término.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e3. BLOQUEADO INDEFINIDAMENTE:\x3c\\\/b\x3e Inabilitação preventiva diante de reincidências, sujeita à reavaliação da Direção.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e4. EXPULSO PERMANENTEMENTE:\x3c\\\/b\x3e Bloqueio definitivo e irrevogável do número e cadastro por violações graves ou tentativas de quebra de segurança.\x3c\\\/li\x3e\x3c\\\/ul\x3e\\\x22,\\n    \\\x22card_conduct_title\\\x22: \\\x22⛔ Regime Disciplinar e Escala de Status Institucionais\\\x22,\\n    \\\x22card_crit_anti_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eCrescimento Autônomo da Coleção:\x3c\\\/b\x3e Se durante a análise algum artigo não constar na base da biblioteca, ele \x3cb\x3eserá adicionado automaticamente ao catálogo\x3c\\\/b\x3e.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eProteção Anti-Duplicação:\x3c\\\/b\x3e Se os arquivos já existirem no repositório, evita-se duplicação e foca-se estritamente na análise comparativa.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eEntregáveis:\x3c\\\/b\x3e Síntese PICO, metodologia, significância estatística, avaliação de viés e \x3cb\x3eMatriz Comparativa Cruzada\x3c\\\/b\x3e.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_crit_anti_title\\\x22: \\\x22⚖️ Incorporação Automática e Anti-Duplicação\\\x22,\\n    \\\x22card_crit_flow_title\\\x22: \\\x22🔬 Fluxo Guiado de Análise Documental\\\x22,\\n    \\\x22card_donor_privacy\\\x22: \\\x22🔒 \x3cb\x3eRegistro de Controle Interno Confidencial:\x3c\\\/b\x3e Os dados dos doadores constam exclusivamente em registro privado para a Direção. Jamais será publicado ou informado quem contribuiu com cada obra.\\\x22,\\n    \\\x22card_evidence_results_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eResumo WhatsApp (3\\u20134 parágrafos):\x3c\\\/b\x3e Consenso atual, conclusões dos 3 artigos mais recentes e recomendação cirúrgica.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eLinks HTTPS Diretos:\x3c\\\/b\x3e Acesso direto ao PubMed, DOI e Consensus para ler o estudo completo original.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eFicha de Evidência em PDF:\x3c\\\/b\x3e Documento clínico formal com tabela comparativa e escala Oxford de evidência.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_evidence_results_title\\\x22: \\\x22📊 Entrega de Resultados Estruturados\\\x22,\\n    \\\x22card_lang_badge\\\x22: \\\x22MULTILINGUISMO ILIMITADO\\\x22,\\n    \\\x22card_lang_comms_desc\\\x22: \\\x22Independentemente do idioma em que o \x3cb\x3eGestor de Conteúdo\x3c\\\/b\x3e redigir os comunicados ou boletins institucionais, a plataforma executa tradução autônoma de alta fidelidade para que cada colega receba a mensagem em seu idioma escolhido.\\\x22,\\n    \\\x22card_lang_comms_hdr\\\x22: \\\x22📢 Comunicados do Gestor de Conteúdo no Seu Idioma:\\\x22,\\n    \\\x22card_lang_desc\\\x22: \\\x22Visando à expansão internacional e ao acolhimento fraterno da comunidade médica global, \x3cb\x3etodo usuário tem a prerrogativa de selecionar o idioma no qual deseja interagir com o assistente, receber respostas, sínteses de evidências e comunicados oficiais\x3c\\\/b\x3e.\\\x22,\\n    \\\x22card_lang_preserve_desc\\\x22: \\\x22\x3cb\x3eOs artigos científicos, guias de técnica cirúrgica AO, livros-texto e monografias em formato PDF são estritamente preservados e baixados em seu idioma original de publicação\x3c\\\/b\x3e.\x3cbr\x3ePara assegurar a máxima fidelidade anatômica, evitar ambiguidades posológicas e respeitar as indicações de implantes certificados, \x3cb\x3eos documentos originais jamais são sintetizados ou modificados por tradução automática\x3c\\\/b\x3e. São entregues autênticos e íntegros como na literatura internacional.\\\x22,\\n    \\\x22card_lang_preserve_hdr\\\x22: \\\x22\x3cspan\x3e🛡️\x3c\\\/span\x3e Princípio Fundamental de Preservação da Originalidade Documental:\\\x22,\\n    \\\x22card_lang_switch_hdr\\\x22: \\\x22🔄 Atualização Imediata e Sem Limite de Frequência:\\\x22,\\n    \\\x22card_large_files_desc\\\x22: \\\x22\x3cp\x3ePara atlas cirúrgicos completos ou grandes tratados digitalizados, o ecossistema dispõe de 4 estratégias otimizadas:\x3c\\\/p\x3e\x3cul style\x3d\\\\\\\x22margin-top: 8px;\\\\\\\x22\x3e\x3cli\x3e\x3cb\x3e1. Anexo pelo WhatsApp (Até 100 MB \\u2013 2 GB):\x3c\\\/b\x3e Envie o arquivo diretamente no WhatsApp com a palavra-chave \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27APORTE\x27)\\\\\\\x22\x3eAPORTE\x3c\\\/span\x3e. Processamento contínuo em streaming.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e2. Envio Fracionado (Chunked Upload):\x3c\\\/b\x3e Na Caixa Digital Web, documentos pesados são segmentados em blocos de 10 MB a 15 MB com barra de progresso em tempo real.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e3. Sessão Reiniciável (Resumable Upload):\x3c\\\/b\x3e Link temporário tolerante a oscilações de rede, permitindo retomar sem perda de dados.\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3e4. Otimização no Navegador:\x3c\\\/b\x3e Ajuste dinâmico prévio a 150\\u2013200 DPI clínicos no seu próprio aparelho, reduzindo até 70% do peso mantendo fidelidade total.\x3c\\\/li\x3e\x3c\\\/ul\x3e\\\x22,\\n    \\\x22card_large_files_title\\\x22: \\\x22📦 Tratados Volumosos e Arquivos Pesados (\x3e 45 MB até 2 GB)\\\x22,\\n    \\\x22card_learning_desc\\\x22: \\\x22\x3cli\x3e\x3cb\x3eMapeamento de Sinônimos:\x3c\\\/b\x3e Associação automática de termos equivalentes (ex. \x3ci\x3eprótese \x26rarr; artroplastia \/ substituição; LCA \x26rarr; ligamento cruzado anterior\x3c\\\/i\x3e).\x3c\\\/li\x3e\x3cli\x3e\x3cb\x3eDetecção de Lacunas:\x3c\\\/b\x3e Pesquisas sem correspondência direta são registradas para orientar aquisição de novos títulos.\x3c\\\/li\x3e\\\x22,\\n    \\\x22card_learning_title\\\x22: \\\x22🧠 Sistema de Autoaprendizagem Contínua\\\x22,\\n    \\\x22card_msg_dir_desc\\\x22: \\\x22Para sugerir novas obras, relatar dúvidas ou falar com a Direção preservando o anonimato bilateral, escreva no chat:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27MENSAGEM A DIRECAO: \x27)\\\\\\\x22\x3eMENSAGEM A DIRECAO: \x5bsua consulta detalhada\x5d\x3c\\\/span\x3e\x3cbr\x3eO sistema encaminha a mensagem à gerência executiva de modo sigiloso.\\\x22,\\n    \\\x22card_msg_dir_title\\\x22: \\\x22📩 Envio de Mensagem à Direção\\\x22,\\n    \\\x22card_option_a_desc\\\x22: \\\x22Os colaboradores podem depositar literatura médica de forma confidencial e protegida por meio do portal anônimo institucional, sem expor contas pessoais nem dados externos.\\\x22,\\n    \\\x22card_option_a_title\\\x22: \\\x22📁 Opção A: Caixa Digital Segura Web\\\x22,\\n    \\\x22card_option_b_desc\\\x22: \\\x22Médicos autorizados podem enviar diretamente um arquivo PDF no chat de WhatsApp acompanhado do termo \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27APORTE\x27)\\\\\\\x22\x3eAPORTE\x3c\\\/span\x3e ou \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27DOAR\x27)\\\\\\\x22\x3eDOAR\x3c\\\/span\x3e.\x3cbr\x3eO assistente valida a integridade, cataloga por subespecialidade e confirma com identificador de registro.\\\x22,\\n    \\\x22card_option_b_title\\\x22: \\\x22📱 Opção B: Ingestão Direta pelo WhatsApp\\\x22,\\n    \\\x22card_pubmed_desc\\\x22: \\\x22Permite interrogar em tempo real mais de 35 milhões de publicações biomédicas indexadas. Para realizar uma consulta científica, envie no chat:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27EVIDENCIA: \x27)\\\\\\\x22\x3eEVIDENCIA: \x5bsua pergunta clínica ou técnica\x5d\x3c\\\/span\x3e\x3cbr\x3e\x3ci\x3eExemplo: \\\\\\\x22EVIDENCIA: Banda de tensão vs placas bloqueadas em fraturas de patela 34-C3\\\\\\\x22\x3c\\\/i\x3e\\\x22,\\n    \\\x22card_pubmed_title\\\x22: \\\x22🌐 Consulta Direta ao PubMed\\\x22,\\n    \\\x22card_resp_dir_desc\\\x22: \\\x22Quando avaliada a solicitação, o médico receberá a resposta em seu próprio WhatsApp com o cabeçalho oficial:\x3cbr\x3e\x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 style\x3d\\\\\\\x22margin-top:6px;\\\\\\\x22\x3eDIREÇÃO DO PROJETO: \x5bresposta institucional\x5d\x3c\\\/span\x3e\x3cbr\x3eAssegurando canal ordenado, transparente e seguro.\\\x22,\\n    \\\x22card_resp_dir_title\\\x22: \\\x22📤 Recebimento de Resposta Oficial\\\x22,\\n    \\\x22card_status_notify\\\x22: \\\x22🔔 \x3cb\x3eProtocolo de Notificação Automática:\x3c\\\/b\x3e Toda alteração de status decidida pela Direção dispara imediatamente mensagem oficial ao médico informando nova condição, motivos e prazo.\\\x22,\\n    \\\x22card_step1_desc\\\x22: \\\x22O médico envia mensagem ao WhatsApp do bot informando: \x3cb\x3eNome Completo\x3c\\\/b\x3e, \x3cb\x3eE-mail (pessoal ou institucional)\x3c\\\/b\x3e, \x3cb\x3eHospital ou Universidade\x3c\\\/b\x3e e \x3cb\x3eNível Atual\x3c\\\/b\x3e (R1\\u2013R4, Especialista, Egresso). O sistema registra a solicitação com status \x3ccode\x3ePENDENTE_APROVAÇÃO\x3c\\\/code\x3e com proteção criptográfica.\\\x22,\\n    \\\x22card_step1_title\\\x22: \\\x221. Solicitação e Registro Inicial\\\x22,\\n    \\\x22card_step2_desc\\\x22: \\\x22A solicitação é avaliada com base em critérios predefinidos de forma autônoma e em conformidade com as diretrizes do projeto, após verificação da veracidade das informações em cerca de \x3cb\x3e24 horas\x3c\\\/b\x3e.\\\x22,\\n    \\\x22card_step2_title\\\x22: \\\x222. Análise e Verificação Autônoma\\\x22,\\n    \\\x22card_step3_desc\\\x22: \\\x22O usuário recebe mensagem de boas-vindas, o link para o Manual Oficial interativo e sua cota habilitada para consultas e downloads clínicos 24\/7.\\\x22,\\n    \\\x22card_step3_title\\\x22: \\\x223. Acesso Pleno Imediato\\\x22,\\n    \\\x22card_support_desc\\\x22: \\\x22Iniciativa médica independente para fortalecer a formação continuada de residentes e cirurgiões ortopedistas. A literatura, guias e monografias fornecidas têm \x3cb\x3ecaráter estritamente pedagógico\x3c\\\/b\x3e; toda decisão diagnóstica e terapêutica cabe exclusivamente ao critério clínico do médico assistente.\\\x22,\\n    \\\x22card_support_title\\\x22: \\\x22🎯 Apoio Médico e Isenção de Responsabilidade\\\x22,\\n    \\\x22card_update_badge\\\x22: \\\x22AUTOGESTÃO SEGURA\\\x22,\\n    \\\x22card_update_cmd_desc\\\x22: \\\x22Para consultar o guia de atualização, envie simplesmente: \x3cspan class\x3d\\\\\\\x22cmd-pill\\\\\\\x22 onclick\x3d\\\\\\\x22copyEditorialCmd(\x27ATUALIZAR DADOS\x27)\\\\\\\x22\x3eATUALIZAR DADOS\x3c\\\/span\x3e\x3cbr\x3eOu envie diretamente seus novos dados em mensagem estruturada:\x3cbr\x3e\x3ccode style\x3d\\\\\\\x22background: var(--slate-100); color: var(--color-primary); padding: 4px 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 8.2pt; display: inline-block; margin-top: 6px; border: 1px solid var(--slate-300);\\\\\\\x22\x3eATUALIZAR: \x5bNome Completo\x5d, \x5bE-mail\x5d, \x5bHospital\/Universidade\x5d, \x5bNível\x5d\x3c\\\/code\x3e\\\x22,\\n    \\\x22card_update_cmd_hdr\\\x22: \\\x22Mecanismo e Comando de Ativação pelo WhatsApp:\\\x22,\\n    \\\x22card_update_desc\\\x22: \\\x22Em consonância com a autodeterminação informativa e rigor cadastral, \x3cb\x3etodo usuário possui o direito inalienável de solicitar a atualização ou retificação dos seus dados pessoais a qualquer momento\x3c\\\/b\x3e (mudança de e-mail, hospital, promoção de residência R1 a R4 ou titulação).\\\x22,\\n    \\\x22card_update_limit_desc\\\x22: \\\x22Com a finalidade exclusiva de manter a rastreabil
